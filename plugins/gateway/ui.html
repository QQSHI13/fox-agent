<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fox-agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{--bg:#0d1117;--panel:#010409;--border:#21262d;--fg:#e6edf3;--dim:#8b949e;--accent:#1f6feb;--ok:#238636;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;height:100vh;display:flex;background:var(--bg);color:var(--fg)}
#side{width:272px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);flex-shrink:0}
#side header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
#side h1{font-size:15px;font-weight:600}
#new{background:var(--ok);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
#sessions{flex:1;overflow-y:auto;padding:8px}
.sess{padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent}
.sess:hover{background:#161b22}
.sess.active{background:#1f6feb22;border-left-color:var(--accent)}
.sess .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11px;color:var(--dim);margin-top:2px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{padding:12px 20px;border-bottom:1px solid var(--border);font-size:14px;color:#c9d1d9;display:flex;align-items:center;gap:10px}
#head .model{font-size:11px;color:var(--dim);background:#161b22;padding:2px 8px;border-radius:10px}
#cancel{background:#b02a37;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;display:none}
#log{flex:1;overflow-y:auto;padding:20px}
.wrap{max-width:860px;margin:0 auto}
.msg{display:flex;gap:10px;margin-bottom:14px}
.avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.msg.user .avatar{background:var(--accent)}
.msg.agent .avatar{background:var(--ok)}
.msg .body{flex:1;min-width:0}
.who{font-size:11px;color:var(--dim);margin-bottom:4px}
.bubble{padding:2px 0;font-size:14px;line-height:1.6;word-wrap:break-word}
.bubble pre{background:#161b22;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
.bubble code{font-family:var(--mono);font-size:.9em;background:#161b22;padding:1px 5px;border-radius:4px}
.bubble pre code{background:none;padding:0}
.bubble p{margin:6px 0}
.think{max-width:860px;margin:0 auto 10px;font-size:12px;color:var(--dim);font-style:italic;border-left:2px solid var(--border);padding-left:10px;white-space:pre-wrap}
.tool{max-width:860px;margin:0 auto 8px;border:1px solid var(--border);border-radius:8px;background:#161b22;overflow:hidden}
.tool .head{padding:7px 11px;font-size:12px;font-family:var(--mono);cursor:pointer;display:flex;gap:8px;align-items:center;user-select:none}
.tool .head .chev{color:var(--dim)}
.tool .head .nm{color:#c9d1d9;font-weight:600}
.tool .head .arg{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tool .head .ok{color:var(--ok)} .tool .head .fail{color:#b02a37}
.tool .body{display:none;border-top:1px solid var(--border);padding:9px 11px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:320px;overflow-y:auto;color:#c9d1d9}
.tool.open .body{display:block}
#composer{padding:14px 20px;border-top:1px solid var(--border)}
#box{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#in{flex:1;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:11px 14px;color:var(--fg);font-size:14px;resize:none;font-family:inherit;line-height:1.4}
#in:focus{outline:none;border-color:var(--accent)}
#send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.5;cursor:default}
.caret{display:inline-block;width:8px;background:var(--accent);animation:blink 1s steps(1) infinite;height:1em;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<aside id="side"><header><h1>fox-agent</h1><button id="new">+ New</button></header><div id="sessions"></div></aside>
<section id="main">
<header id="head"><span id="title">Select a session</span><span class="model" id="model"></span><button id="cancel">■ Cancel</button></header>
<div id="log"><div class="wrap" id="empty" style="color:var(--dim);text-align:center;margin-top:20vh">Pick a session on the left, or create a new one.</div></div>
<footer id="composer"><div id="box"><textarea id="in" rows="1" placeholder="Message fox-agent…  (Enter to send, Shift+Enter for newline)"></textarea><button id="send">Send</button></div></footer>
</section>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
$('#model').textContent='%MODEL%';
let ws, sid=null, runActive=false, textBuf='', thinkBuf='';
const liveTool={};
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.event) onEvent(m); else if(m.id&&pending[m.id]){pending[m.id](m.result);delete pending[m.id];}};
  ws.onclose=()=>setTimeout(connect,1000);
}
const pending={}; let mid=0;
function rpc(method,params){return new Promise(res=>{const id=++mid;pending[id]=res;ws.send(JSON.stringify({id,method,params}));});}
const md=t=>window.marked?marked.parse(t):esc(t);

async function loadSessions(activeId){
  const list=await rpc('session.list');
  $('#sessions').innerHTML=list.map(s=>`<div class="sess ${s.id===activeId?'active':''}" data-id="${s.id}"><div class="t">${esc(s.title||s.id)}</div><div class="m">${esc(s.cwd)} · ${new Date(s.updated_at).toLocaleString()}</div></div>`).join('');
  document.querySelectorAll('.sess').forEach(el=>el.onclick=()=>openSession(el.dataset.id));
}
$('#new').onclick=async()=>{const s=await rpc('session.new',{});await loadSessions(s.id);openSession(s.id);};
async function openSession(id){
  sid=id; await loadSessions(id);
  const s=await rpc('session.get',{id});
  $('#title').textContent=s.title||s.id; $('#empty')?.remove();
  $('#log').innerHTML='<div class="wrap" id="transcript"></div>';
  const tr=$('#transcript');
  for(const m of s.messages) tr.appendChild(renderMsg(m.role,m.content));
  scroll(); $('#in').focus();
}
function renderMsg(role,content){
  const d=document.createElement('div');d.className='msg '+role;
  d.innerHTML=`<div class="avatar">${role==='user'?'Q':'F'}</div><div class="body"><div class="who">${role}</div><div class="bubble">${md(content)}</div></div>`;
  return d;
}
function bubbleEl(role){
  $('#empty')?.remove(); if(!$('#transcript'))$('#log').innerHTML='<div class="wrap" id="transcript"></div>';
  const d=renderMsg(role,'');$('#transcript').appendChild(d);scroll();return d.querySelector('.bubble');
}
function scroll(){const l=$('#log');l.scrollTop=l.scrollHeight;}
function onEvent(ev){
  if(ev.sessionId!==sid)return;
  const tr=$('#transcript'); if(!tr)return;
  if(ev.event==='turn.status'){
    if(ev.state==='started'){runActive=true;textBuf='';thinkBuf='';$('#cancel').style.display='inline-block';}
    else{runActive=false;$('#cancel').style.display='none';if(textBuf&&window.marked)tr.lastChild&&tr.lastChild.querySelector('.bubble')&&0;finishText();loadSessions(sid);}
  }
  else if(ev.event==='turn.think'){
    thinkBuf+=ev.delta;
    let th=tr.querySelector('.think.live');
    if(!th){th=document.createElement('div');th.className='think live';th.textContent='thinking…';tr.appendChild(th);scroll();}
    th.textContent=thinkBuf.slice(-600);
  }
  else if(ev.event==='turn.delta'){
    if(thinkBuf){const th=tr.querySelector('.think.live');if(th){th.classList.remove('live');thinkBuf='';}}
    textBuf+=ev.delta; streamText();
  }
  else if(ev.event==='turn.tool_start'){addTool(ev.id,ev.name,ev.args);if(thinkBuf){const th=tr.querySelector('.think.live');if(th)th.classList.remove('live');thinkBuf='';}}
  else if(ev.event==='turn.tool_end'){endTool(ev.id,ev.output,ev.ok);}
}
let curBubble=null;
function streamText(){
  if(!curBubble)curBubble=bubbleEl('agent');
  curBubble.innerHTML=md(textBuf)+'<span class="caret"></span>';scroll();
}
function finishText(){if(curBubble){curBubble.innerHTML=md(textBuf);curBubble=null;}textBuf='';}
function addTool(id,name,args){
  finishText();
  const d=document.createElement('div');d.className='tool';d.id='t_'+id;
  d.innerHTML=`<div class="head"><span class="chev">▸</span><span class="nm">${esc(name)}</span><span class="arg">${esc((args||'').slice(0,100))}</span><span class="st"></span></div><div class="body"></div>`;
  d.querySelector('.head').onclick=()=>d.classList.toggle('open');
  $('#transcript').appendChild(d);scroll();
}
function endTool(id,output,ok){
  const d=document.getElementById('t_'+id);if(!d)return;
  d.querySelector('.st').innerHTML=ok?'<span class="ok">✓</span>':'<span class="fail">✗</span>';
  d.querySelector('.chev').textContent='▾';d.classList.add('open');
  d.querySelector('.body').textContent=(output||'').slice(0,4000);
}
$('#cancel').onclick=()=>rpc('turn.cancel',{sessionId:sid});
const input=$('#in');
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
  input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';
});
async function send(){
  if(!sid||runActive&&!textBuf&&!thinkBuf){}
  const text=input.value.trim();if(!text||!sid)return;
  input.value='';input.style.height='auto';
  const ub=bubbleEl('user');ub.textContent=text;
  finishText();
  await rpc('turn.send',{sessionId:sid,prompt:text});
}
connect();loadSessions();
</script>
</body>
</html>
