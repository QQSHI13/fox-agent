<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="fox-model" content="%MODEL%">
<meta name="fox-version" content="%VERSION%">
<title>fox-agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129418;</text></svg>">
<script src="/md.js"></script>
<style>
/* ---- theme tokens ------------------------------------------------------
   Every colour the UI uses is a token here. Dark is the base; the light
   palette overrides the same names, so a component never knows which theme
   it is in. `data-theme` on <html> wins over the OS; "auto" follows it. */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0e14;
  --bg-elev: #11151d;
  --panel: #0d1117;
  --panel-2: #161b22;
  --panel-3: #1c2230;
  --border: #232a36;
  --border-strong: #323b4b;
  --fg: #e6edf3;
  --fg-2: #c3ccd8;
  --dim: #8b949e;
  --dim-2: #6e7681;
  --accent: #4493f8;
  --accent-bg: #1f6feb26;
  --accent-fg: #ffffff;
  --ok: #3fb950;
  --ok-bg: #23863622;
  --bad: #f85149;
  --bad-bg: #b02a3722;
  --warn: #d29922;
  --warn-bg: #9a670022;
  --user-bg: #1f6feb1f;
  --code-bg: #161b22;
  --shadow: 0 10px 40px #0009, 0 2px 8px #0006;
  --ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --radius: 10px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sidebar-w: 292px;
  --measure: 46rem;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff;
  --bg-elev: #f6f8fa;
  --panel: #f6f8fa;
  --panel-2: #eef1f5;
  --panel-3: #e6eaf0;
  --border: #d8dee6;
  --border-strong: #bcc5d0;
  --fg: #1f2328;
  --fg-2: #32383f;
  --dim: #5c646e;
  --dim-2: #7d8590;
  --accent: #0969da;
  --accent-bg: #0969da14;
  --accent-fg: #ffffff;
  --ok: #1a7f37;
  --ok-bg: #1a7f3714;
  --bad: #cf222e;
  --bad-bg: #cf222e14;
  --warn: #9a6700;
  --warn-bg: #9a670014;
  --user-bg: #0969da12;
  --code-bg: #f0f3f7;
  --shadow: 0 10px 40px #1f232826, 0 2px 8px #1f23281a;
}
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    color-scheme: light;
    --bg: #ffffff; --bg-elev: #f6f8fa; --panel: #f6f8fa; --panel-2: #eef1f5; --panel-3: #e6eaf0;
    --border: #d8dee6; --border-strong: #bcc5d0; --fg: #1f2328; --fg-2: #32383f;
    --dim: #5c646e; --dim-2: #7d8590; --accent: #0969da; --accent-bg: #0969da14; --accent-fg: #ffffff;
    --ok: #1a7f37; --ok-bg: #1a7f3714; --bad: #cf222e; --bad-bg: #cf222e14;
    --warn: #9a6700; --warn-bg: #9a670014; --user-bg: #0969da12; --code-bg: #f0f3f7;
    --shadow: 0 10px 40px #1f232826, 0 2px 8px #1f23281a;
  }
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #0b0e14; --bg-elev: #11151d; --panel: #0d1117; --panel-2: #161b22; --panel-3: #1c2230;
    --border: #232a36; --border-strong: #323b4b; --fg: #e6edf3; --fg-2: #c3ccd8;
    --dim: #8b949e; --dim-2: #6e7681; --accent: #4493f8; --accent-bg: #1f6feb26; --accent-fg: #ffffff;
    --ok: #3fb950; --ok-bg: #23863622; --bad: #f85149; --bad-bg: #b02a3722;
    --warn: #d29922; --warn-bg: #9a670022; --user-bg: #1f6feb1f; --code-bg: #161b22;
    --shadow: 0 10px 40px #0009, 0 2px 8px #0006;
  }
}

/* ---- base --------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  background: var(--bg);
  color: var(--fg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 6px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: fixed; left: 8px; top: -60px; z-index: 100;
  background: var(--accent); color: var(--accent-fg); padding: 8px 14px;
  border-radius: 8px; text-decoration: none; transition: top .12s;
}
.skip:focus { top: 8px; }

/* ---- app shell ---------------------------------------------------------- */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-rows: 100%;
  height: 100dvh;
  overflow: hidden;
}
#app[data-sidebar="collapsed"] { grid-template-columns: 0 1fr; }
#app[data-sidebar="collapsed"] #sidebar { visibility: hidden; }

#sidebar {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.side-top {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 12px 10px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; letter-spacing: .2px; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); flex-shrink: 0; }
.brand .dot[data-state="down"] { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.brand .dot[data-state="connecting"] { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); animation: pulse 1.4s ease-in-out infinite; }
.brand .ver { font-size: 10px; color: var(--dim-2); font-family: var(--mono); font-weight: 400; }
.side-actions { margin-left: auto; display: flex; gap: 4px; }

.btn {
  background: var(--panel-2); color: var(--fg-2);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 11px; font-size: 13px; line-height: 1.2;
  transition: background .12s, border-color .12s, color .12s;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--panel-3); border-color: var(--border-strong); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); font-weight: 550; }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn-danger { background: var(--bad); border-color: transparent; color: #fff; font-weight: 550; }
.btn-danger:hover { filter: brightness(1.08); background: var(--bad); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--dim); padding: 6px 8px; }
.btn-ghost:hover { background: var(--panel-2); color: var(--fg); }
.btn-icon { padding: 6px; width: 32px; height: 32px; justify-content: center; }
.btn-sm { padding: 4px 8px; font-size: 12px; }

.side-search { padding: 10px 12px 6px; }
.field {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 10px; font-size: 13px; color: var(--fg);
}
.field::placeholder { color: var(--dim-2); }
.field:focus { border-color: var(--accent); }

#sessionList { flex: 1; overflow-y: auto; padding: 4px 8px 16px; scrollbar-width: thin; }
.session {
  display: block; width: 100%; text-align: left;
  padding: 8px 10px; margin-bottom: 2px; border-radius: 8px;
  background: transparent; border: 1px solid transparent; border-left-width: 3px;
  color: inherit; transition: background .1s;
}
.session:hover { background: var(--panel-2); }
.session[aria-current="true"] { background: var(--accent-bg); border-left-color: var(--accent); }
.session .t { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.session .t .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session .m {
  font-size: 11px; color: var(--dim); font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
}
.session .run {
  width: 7px; height: 7px; border-radius: 50%; background: var(--warn);
  flex-shrink: 0; animation: pulse 1.2s ease-in-out infinite;
}
.session-group {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--dim-2); padding: 12px 10px 4px; font-weight: 600;
}
.side-foot {
  border-top: 1px solid var(--border); padding: 8px 10px;
  display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--dim-2);
}

/* ---- main column -------------------------------------------------------- */
#main { display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }

#header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; min-height: 52px;
  border-bottom: 1px solid var(--border); background: var(--bg-elev);
  flex-shrink: 0;
}
#header .mid { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
#title {
  font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
#title:blank, #title[data-empty="true"] { color: var(--dim); font-weight: 500; }
.meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); min-width: 0; }
.meta .chip {
  font-family: var(--mono); background: var(--panel-2); border: 1px solid var(--border);
  padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  max-width: 22rem; overflow: hidden; text-overflow: ellipsis;
}
.meta button.chip { color: var(--dim); }
.meta button.chip:hover { color: var(--fg); border-color: var(--border-strong); }
#header .tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

#statusBar {
  display: none; align-items: center; gap: 10px;
  padding: 7px 14px; font-size: 12.5px;
  background: var(--warn-bg); color: var(--warn);
  border-bottom: 1px solid var(--border);
}
#statusBar.on { display: flex; }
#statusBar[data-kind="down"] { background: var(--bad-bg); color: var(--bad); }
#statusBar .sp { flex: 1; }

/* ---- transcript --------------------------------------------------------- */
#transcriptWrap { flex: 1; position: relative; min-height: 0; }
#transcript {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  padding: 18px 14px 8px; scroll-behavior: smooth;
  overscroll-behavior: contain;
}
#app[data-sidebar="collapsed"] ~ #main #transcript { padding-left: 18px; }
#scroll { max-width: var(--measure); margin: 0 auto; }

.msg { display: flex; gap: 10px; margin: 0 0 16px; }
.avatar {
  width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--panel-3); color: var(--fg-2); margin-top: 1px;
  user-select: none;
}
.msg.user .avatar { background: var(--accent); color: var(--accent-fg); }
.msg.assistant .avatar, .msg.agent .avatar { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.msg .body { flex: 1; min-width: 0; }
.who { font-size: 11px; color: var(--dim); margin-bottom: 3px; display: flex; gap: 8px; align-items: center; }
.who .seq { font-family: var(--mono); color: var(--dim-2); }
.who .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
.bubble { font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.msg.user .bubble {
  background: var(--user-bg); border: 1px solid var(--border);
  border-radius: 12px; padding: 9px 12px; white-space: pre-wrap;
}
.msg.user .bubble p { margin: 0; }
.msg.system .bubble, .msg.error .bubble { color: var(--dim); font-size: 13px; }

.bubble > :first-child { margin-top: 0; }
.bubble > :last-child { margin-bottom: 0; }
.bubble p { margin: 0 0 .7em; }
.bubble h1, .bubble h2, .bubble h3, .bubble h4, .bubble h5, .bubble h6 {
  margin: 1.1em 0 .45em; line-height: 1.3; font-weight: 650;
}
.bubble h1 { font-size: 1.32em; } .bubble h2 { font-size: 1.18em; } .bubble h3 { font-size: 1.06em; }
.bubble h4, .bubble h5, .bubble h6 { font-size: 1em; }
.bubble ul, .bubble ol { margin: .5em 0 .7em; padding-left: 1.5em; }
.bubble li { margin: .18em 0; }
.bubble li.task { list-style: none; margin-left: -1.2em; }
.bubble li.task input { margin-right: .5em; accent-color: var(--accent); }
.bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
.bubble a:hover { border-bottom-color: currentColor; }
.bubble blockquote {
  margin: .7em 0; padding: .1em 0 .1em .9em;
  border-left: 3px solid var(--border-strong); color: var(--fg-2);
}
.bubble hr { border: 0; border-top: 1px solid var(--border); margin: 1.1em 0; }
.bubble code {
  font-family: var(--mono); font-size: .875em;
  background: var(--code-bg); border: 1px solid var(--border);
  padding: .1em .38em; border-radius: 5px;
}
.bubble pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 9px;
  padding: 10px 12px; overflow-x: auto; margin: .7em 0; position: relative;
  max-height: 26rem; overflow-y: auto;
}
.bubble pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.5; }
.bubble table { border-collapse: collapse; margin: .7em 0; font-size: 13px; display: block; overflow-x: auto; max-width: 100%; }
.bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
.bubble th { background: var(--panel-2); font-weight: 600; }
.bubble del { color: var(--dim); }
.caret {
  display: inline-block; width: 2px; height: 1.05em; vertical-align: -.15em;
  background: var(--accent); margin-left: 1px; animation: blink 1.05s steps(1) infinite;
}

/* thinking: collapsed by default, one summary line when closed */
.think { margin: 0 0 10px; }
.think details { border: 1px dashed var(--border-strong); border-radius: 9px; background: var(--bg-elev); }
.think summary {
  cursor: pointer; padding: 6px 11px; font-size: 12px; color: var(--dim);
  display: flex; align-items: center; gap: 7px; user-select: none; list-style: none;
}
.think summary::-webkit-details-marker { display: none; }
.think summary .chev { transition: transform .12s; font-size: 9px; }
.think details[open] summary .chev { transform: rotate(90deg); }
.think .content {
  padding: 2px 12px 10px; font-size: 12.5px; line-height: 1.55; color: var(--dim);
  font-style: italic; white-space: pre-wrap; max-height: 22rem; overflow-y: auto;
  border-top: 1px solid var(--border);
}

/* tool cards */
.tool {
  margin: 0 0 10px; border: 1px solid var(--border); border-radius: 9px;
  background: var(--bg-elev); overflow: hidden;
}
.tool > summary {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  font-family: var(--mono); font-size: 12px; cursor: pointer; list-style: none;
  user-select: none;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool > summary:hover { background: var(--panel-2); }
.tool .chev { color: var(--dim-2); font-size: 9px; transition: transform .12s; }
.tool[open] > summary .chev { transform: rotate(90deg); }
.tool .nm { color: var(--fg); font-weight: 650; }
.tool .arg {
  color: var(--dim); flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool[open] .arg { display: none; }
.tool .tstat {
  font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight: 650;
  text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0; white-space: nowrap;
}
.tool .tstat[data-s="running"] { background: var(--warn-bg); color: var(--warn); }
.tool .tstat[data-s="ok"] { background: var(--ok-bg); color: var(--ok); }
.tool .tstat[data-s="fail"] { background: var(--bad-bg); color: var(--bad); }
.tool .hint { font-size: 10.5px; color: var(--dim-2); flex-shrink: 0; }
.tool .pane { border-top: 1px solid var(--border); }
.tool .pane .lbl {
  font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim-2);
  padding: 7px 11px 2px;
}
.tool .pane pre {
  margin: 0; padding: 2px 11px 9px; font-family: var(--mono); font-size: 11.5px;
  line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--fg-2); max-height: 22rem; overflow: auto;
}
.tool .pane pre.muted { color: var(--dim); font-style: italic; }

/* inline notices inside the transcript (command output, errors, cancelled) */
.notice {
  max-width: 100%; margin: 0 0 14px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg-elev);
  padding: 9px 12px; font-size: 13px;
}
.notice[data-kind="error"] { border-color: var(--bad); background: var(--bad-bg); }
.notice[data-kind="warn"] { border-color: var(--warn); background: var(--warn-bg); }
.notice .nhead {
  display: flex; align-items: center; gap: 8px; font-size: 11.5px;
  color: var(--dim); margin-bottom: 5px; font-family: var(--mono);
}
.notice[data-kind="error"] .nhead { color: var(--bad); }
.notice .nbody { white-space: pre-wrap; overflow-wrap: anywhere; }
.notice .nbody p { margin: .3em 0; }
.notice .nactions { margin-top: 8px; display: flex; gap: 6px; }

/* empty / loading states */
/* The empty/loading state block. Scoped with :not(.tool *) semantics by name:
   an earlier version called the tool card's status chip `.state` too, and the
   `margin: 12vh` below landed inside a collapsed summary, making every tool
   card 90px tall. Distinct names are the fix; this comment is why. */
.state {
  max-width: 30rem; margin: 12vh auto 0; text-align: center; padding: 0 16px;
  color: var(--dim);
}
.state .big { font-size: 30px; margin-bottom: 10px; opacity: .75; }
.state h2 { margin: 0 0 6px; font-size: 16px; color: var(--fg); font-weight: 600; }
.state p { margin: 0 0 14px; font-size: 13.5px; line-height: 1.5; }
.state .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.state kbd, .kbd {
  font-family: var(--mono); font-size: 11px; background: var(--panel-2);
  border: 1px solid var(--border-strong); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 5px;
}
.skeleton { max-width: var(--measure); margin: 0 auto; }
.skel { height: 12px; border-radius: 6px; background: var(--panel-2); margin: 10px 0; animation: shimmer 1.4s linear infinite; }
.skel.w40 { width: 40%; } .skel.w70 { width: 70%; } .skel.w90 { width: 90%; }
#loadOlder {
  display: block; margin: 0 auto 16px; font-size: 12px;
}

/* jump-to-latest pill */
#jump {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(8px);
  background: var(--panel-3); color: var(--fg); border: 1px solid var(--border-strong);
  border-radius: 999px; padding: 6px 14px; font-size: 12px; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 4;
}
#jump.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

/* ---- composer ----------------------------------------------------------- */
#composer { border-top: 1px solid var(--border); background: var(--bg-elev); padding: 10px 14px 12px; flex-shrink: 0; }
#composer .box { max-width: var(--measure); margin: 0 auto; position: relative; }
#inputWrap {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 8px 8px 12px; transition: border-color .12s, box-shadow .12s;
}
#inputWrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
#inputWrap[data-muted="true"] { opacity: .65; }
#prompt {
  flex: 1; background: transparent; border: 0; resize: none; color: var(--fg);
  font-family: inherit; font-size: 14.5px; line-height: 1.5;
  max-height: 40vh; min-height: 24px; padding: 2px 0; overflow-y: auto;
}
#prompt:focus { outline: none; }
/* the wrapper already shows the focus ring for the whole composer; a second
   ring on the textarea inside it reads as a double border */
#prompt:focus-visible { box-shadow: none; }
#prompt::placeholder { color: var(--dim-2); }
#prompt:disabled { cursor: not-allowed; }
.sendBtn { flex-shrink: 0; height: 34px; padding: 0 14px; border-radius: 9px; }
.footRow {
  max-width: var(--measure); margin: 6px auto 0; display: flex; align-items: center;
  gap: 10px; font-size: 11px; color: var(--dim-2); min-height: 16px;
}
.footRow .sp { flex: 1; }
.footRow .hint-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.footRow .count[data-hot="true"] { color: var(--warn); }

/* command palette (slash hints) */
#palette {
  position: absolute; bottom: calc(100% - 6px); left: 0; right: 0;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: 11px; box-shadow: var(--shadow); overflow: hidden;
  z-index: 20; display: none; max-height: 46vh; flex-direction: column;
}
#palette.on { display: flex; }
#palette .phead {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--dim-2); padding: 7px 12px 5px; border-bottom: 1px solid var(--border);
}
#paletteList { overflow-y: auto; padding: 4px; }
.pal-item {
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  padding: 7px 9px; border-radius: 7px; background: transparent; border: 0;
  text-align: left; color: var(--fg-2);
}
.pal-item .n { font-family: var(--mono); font-size: 12.5px; color: var(--fg); font-weight: 600; flex-shrink: 0; }
.pal-item .u { font-family: var(--mono); font-size: 11px; color: var(--dim-2); flex-shrink: 0; }
.pal-item .d { font-size: 12px; color: var(--dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-item .lock { font-size: 10px; color: var(--dim-2); flex-shrink: 0; }
.pal-item[aria-selected="true"] { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
.pal-item:hover { background: var(--panel-2); }
.pal-item[aria-selected="true"]:hover { background: var(--accent-bg); }
#palette .pfoot {
  border-top: 1px solid var(--border); padding: 6px 12px; font-size: 11px;
  color: var(--dim-2); display: flex; gap: 12px; flex-wrap: wrap;
}

/* ---- overlays: modal, drawer, panel ------------------------------------- */
.scrim {
  position: fixed; inset: 0; background: #0006; backdrop-filter: blur(2px);
  z-index: 40; opacity: 0; pointer-events: none; transition: opacity .16s;
}
.scrim.on { opacity: 1; pointer-events: auto; }

.modal {
  position: fixed; z-index: 41; left: 50%; top: 10vh; transform: translateX(-50%) translateY(-6px);
  width: min(42rem, calc(100vw - 24px)); max-height: 76dvh;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: 14px; box-shadow: var(--shadow);
  display: none; flex-direction: column; overflow: hidden;
  opacity: 0; transition: opacity .16s, transform .16s;
}
.modal.on { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
.modal .mhead {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.modal .mhead h2 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
.modal .mbody { padding: 10px 16px; }
.modal .mfoot {
  border-top: 1px solid var(--border); padding: 8px 16px;
  font-size: 11.5px; color: var(--dim-2); display: flex; gap: 12px; flex-wrap: wrap;
}
.pick-list { overflow-y: auto; max-height: 46dvh; margin: 6px -16px 0; }
.pick {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 16px; background: transparent; border: 0; border-left: 3px solid transparent;
  color: inherit;
}
.pick:hover { background: var(--panel-2); }
.pick[aria-selected="true"] { background: var(--accent-bg); border-left-color: var(--accent); }
.pick .pti { flex: 1; min-width: 0; }
.pick .pt { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pm { font-size: 11px; color: var(--dim); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.pick .prun { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.empty-row { padding: 16px; text-align: center; color: var(--dim); font-size: 13px; }

/* side panel: the debug log, plugin panels */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 42;
  width: min(46rem, 96vw); background: var(--panel);
  border-left: 1px solid var(--border-strong); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  transform: translateX(101%); transition: transform .2s ease-out;
}
.panel.on { transform: translateX(0); }
.panel .phead {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel .phead h2 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
.panel .pmeta {
  font-size: 11px; font-family: var(--mono); color: var(--dim); padding: 6px 14px;
  border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.panel .pbody { flex: 1; overflow: auto; min-height: 0; }
.panel pre.log {
  margin: 0; padding: 10px 14px; font-family: var(--mono); font-size: 11.5px;
  line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2);
}
.panel iframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
.panel .ptabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.ptab {
  padding: 4px 10px; border-radius: 7px; font-size: 12px;
  background: transparent; border: 1px solid transparent; color: var(--dim);
}
.ptab[aria-selected="true"] { background: var(--panel-2); color: var(--fg); border-color: var(--border); }

/* toast */
#toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--panel-3); color: var(--fg); border: 1px solid var(--border-strong);
  border-radius: 10px; padding: 9px 14px; font-size: 13px; box-shadow: var(--shadow);
  z-index: 60; opacity: 0; pointer-events: none; transition: opacity .16s, transform .16s;
  max-width: min(32rem, 92vw);
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast[data-kind="error"] { border-color: var(--bad); color: var(--bad); }

/* ---- narrow viewport: the sidebar becomes a drawer --------------------- */
#drawerToggle { display: none; }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; }
  #drawerToggle { display: inline-flex; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
    width: min(84vw, 320px); transform: translateX(-101%);
    transition: transform .2s ease-out; border-right: 1px solid var(--border-strong);
    box-shadow: var(--shadow);
  }
  #app[data-drawer="open"] #sidebar { transform: translateX(0); }
  #app[data-sidebar="collapsed"] #sidebar { visibility: visible; }
  #transcript { padding: 12px 10px 4px; }
  #composer { padding: 8px 10px 10px; }
  #header { padding: 8px 10px; min-height: 48px; gap: 6px; }
  .footRow .hint-txt { display: none; }
  body { font-size: 14.5px; }
}
@media (max-width: 520px) {
  .meta .chip.cwd { max-width: 9rem; }
  #header .tools .btn .txt { display: none; }
  #header .tools .btn { padding: 6px; width: 32px; justify-content: center; }
  .bubble pre { max-height: 18rem; }
}

/* ---- motion ------------------------------------------------------------- */
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes shimmer { 0% { opacity: .55; } 50% { opacity: 1; } 100% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  #transcript { scroll-behavior: auto; }
  .caret { animation: none; opacity: 1; }
}
@media print {
  #sidebar, #composer, #header .tools, #statusBar, #jump { display: none !important; }
  #app { grid-template-columns: 1fr; }
  body { overflow: visible; }
  #transcript { overflow: visible; height: auto; }
}
</style>
</head>
<body>
<a class="skip" href="#prompt">Skip to composer</a>

<div id="app" data-sidebar="open" data-drawer="closed">
  <aside id="sidebar" aria-label="Sessions">
    <div class="side-top">
      <span class="brand"><span class="dot" id="connDot" data-state="connecting" title="connecting"></span>
        fox-agent <span class="ver">%VERSION%</span></span>
      <span class="side-actions">
        <button class="btn btn-primary btn-sm" id="newBtn" title="New session (Alt+N)">+ New</button>
        <button class="btn btn-ghost btn-icon" id="collapseBtn" title="Hide sidebar (Ctrl+B)" aria-label="Hide sidebar">&#x2039;</button>
      </span>
    </div>
    <div class="side-search">
      <input class="field" id="sessionFilter" type="search" placeholder="Filter sessions…" aria-label="Filter sessions" autocomplete="off" spellcheck="false">
    </div>
    <div id="sessionList" role="listbox" aria-label="Session list"></div>
    <div class="side-foot">
      <span id="sessionCount">—</span><span style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" id="logBtn" title="Debug log">Log</button>
      <button class="btn btn-ghost btn-sm" id="themeBtn" title="Theme: auto / light / dark">Theme: auto</button>
    </div>
  </aside>

  <main id="main">
    <header id="header">
      <button class="btn btn-ghost btn-icon" id="drawerToggle" aria-label="Open sessions" aria-expanded="false" aria-controls="sidebar">&#x2261;</button>
      <div class="mid">
        <div id="title" data-empty="true">No session</div>
        <div class="meta">
          <button class="chip cwd" id="cwdChip" hidden title="working directory"></button>
          <span class="chip model" id="modelChip" title="model">%MODEL%</span>
        </div>
      </div>
      <div class="tools">
        <button class="btn" id="switchBtn" title="Switch session (Ctrl+K)">&#x21C5; <span class="txt">Sessions</span></button>
        <button class="btn" id="stopBtn" hidden title="Stop the running turn (Esc)">&#x25A0; <span class="txt">Stop</span></button>
      </div>
    </header>

    <div id="statusBar" role="status" aria-live="polite">
      <span id="statusText"></span><span class="sp"></span>
      <button class="btn btn-sm" id="retryBtn" hidden>Retry now</button>
    </div>

    <div id="transcriptWrap">
      <div id="transcript" tabindex="0" role="log" aria-label="Conversation">
        <div id="scroll">
          <div class="state" id="bootState">
            <div class="big">&#x1F98A;</div>
            <h2>Connecting…</h2>
            <p>Waiting for the gateway.</p>
            <div class="skeleton"><div class="skel w90"></div><div class="skel w70"></div><div class="skel w40"></div></div>
          </div>
        </div>
      </div>
      <button id="jump" class="btn">&#x2193; Jump to latest</button>
    </div>

    <footer id="composer">
      <div class="box">
        <div id="palette" role="listbox" aria-label="Slash commands">
          <div class="phead" id="paletteHead">Commands</div>
          <div id="paletteList"></div>
          <div class="pfoot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">Tab</span> complete</span><span><span class="kbd">Enter</span> run</span><span><span class="kbd">Esc</span> close</span></div>
        </div>
        <div id="inputWrap">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" placeholder="Message fox-agent…" autocomplete="off" spellcheck="false"></textarea>
          <button class="btn btn-primary sendBtn" id="sendBtn" title="Send (Enter)">Send</button>
        </div>
        <div class="footRow">
          <span class="hint-txt" id="footHint"><span class="kbd">Enter</span> send · <span class="kbd">Shift+Enter</span> newline · <span class="kbd">/</span> commands</span>
          <span class="sp"></span>
          <span class="count" id="charCount"></span>
        </div>
      </div>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<!-- session switcher -->
<div class="modal" id="switcher" role="dialog" aria-modal="true" aria-labelledby="switcherTitle">
  <div class="mhead">
    <h2 id="switcherTitle">Switch session</h2>
    <button class="btn btn-ghost btn-sm" data-close>Esc</button>
  </div>
  <div class="mbody">
    <input class="field" id="switchFilter" type="search" placeholder="Filter by title, cwd or id…" aria-label="Filter sessions" autocomplete="off">
    <div class="pick-list" id="switchList" role="listbox" aria-label="Sessions"></div>
  </div>
  <div class="mfoot"><span><span class="kbd">↑</span><span class="kbd">↓</span> move</span><span><span class="kbd">Enter</span> open</span><span><span class="kbd">Esc</span> close</span></div>
</div>

<!-- side panel: debug log + plugin panels share it -->
<div class="panel" id="sidePanel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
  <div class="phead">
    <h2 id="panelTitle">Debug log</h2>
    <button class="btn btn-sm" id="panelRefresh">Refresh</button>
    <button class="btn btn-ghost btn-sm" id="panelClose" aria-label="Close panel">&#x2715;</button>
  </div>
  <div class="ptabs" id="panelTabs" hidden></div>
  <div class="pmeta" id="panelMeta"></div>
  <div class="pbody" id="panelBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="ariaLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script src="/ui.js"></script>
</body>
</html>
