<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="fox-model" content="%MODEL%">
<meta name="fox-version" content="%VERSION%">
<title>fox-agent</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23101114'/><path d='M9 22V10h2.4v4.6h5.2V10H19v12h-2.4v-5H11.4v5z' fill='%23e8eaed'/></svg>">
<script src="/md.js"></script>
<script src="/replay.js"></script>
<style>
/* ===========================================================================
   fox-agent gateway - design tokens
   ===========================================================================
   The system is deliberately MONOCHROME: hierarchy comes from type weight,
   size and hairline rules, not from colour. Colour is used for exactly two
   things, and both are information rather than decoration:

     1. state  - a running turn, a failure, a confirmed result
     2. interaction - focus rings and links (one hue, --accent)

   That keeps a long transcript calm: if something on screen is coloured, it
   means something. Tokens below are the entire vocabulary - a component never
   hardcodes a colour, a size or a radius, so re-theming is one block.
   --------------------------------------------------------------------------- */

:root {
  /* type: one family for prose, one for machine facts */
  --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  /* type scale (rem-free: the app is a fixed-density tool, not a document) */
  --t-2xs: 10.5px;
  --t-xs: 11.5px;
  --t-sm: 12.5px;
  --t-base: 13.5px;
  --t-md: 15px;
  --t-lg: 19px;
  --t-xl: 23px;

  /* spacing - 4px base, named by step so layouts read as intent */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;
  --s-8: 32px;
  --s-10: 40px;

  --r-1: 5px;
  --r-2: 8px;
  --r-3: 12px;
  --r-full: 999px;

  /* layout */
  --rail: 280px;
  --measure: 44rem;
  --gutter: 46px;
  --head-h: 62px;

  /* motion - short and mechanical; nothing bounces */
  --ease: cubic-bezier(.2, .7, .3, 1);
  --dur-1: 90ms;
  --dur-2: 160ms;
}

/* --- dark: the base palette ------------------------------------------------ */
:root, :root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0b0d;
  --surface: #0f1013;
  --surface-2: #15171b;
  --surface-3: #1c1f24;
  --surface-4: #24272e;
  --line: #202329;
  --line-2: #2b2f37;
  --line-3: #3a3f49;

  --ink: #e9ebef;
  --ink-2: #b3b9c2;
  --ink-3: #828a95;
  --ink-4: #5a616b;

  --accent: #8ab4f8;
  --accent-dim: #8ab4f826;
  --accent-ink: #0a0b0d;

  --ok: #6ecf83;
  --ok-dim: #6ecf831c;
  --warn: #e5b567;
  --warn-dim: #e5b5671c;
  --bad: #e8756b;
  --bad-dim: #e8756b1c;

  --sel: #ffffff0d;
  --code-bg: #121418;
  --overlay: #06070a99;
  --shadow: 0 16px 48px #00000066, 0 2px 10px #0000004d;
}

/* --- light ----------------------------------------------------------------- */
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #fcfcfd;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --surface-3: #edeff2;
  --surface-4: #e3e6ea;
  --line: #e4e7eb;
  --line-2: #d3d7dd;
  --line-3: #b9bfc7;

  --ink: #15181d;
  --ink-2: #3c434d;
  --ink-3: #667080;
  --ink-4: #8d95a1;

  --accent: #1f6feb;
  --accent-dim: #1f6feb14;
  --accent-ink: #ffffff;

  --ok: #1a7f43;
  --ok-dim: #1a7f4314;
  --warn: #8f5a00;
  --warn-dim: #8f5a0014;
  --bad: #b62a26;
  --bad-dim: #b62a2614;

  --sel: #0000000a;
  --code-bg: #f5f6f8;
  --overlay: #1a1d2380;
  --shadow: 0 16px 48px #1a1d231f, 0 2px 10px #1a1d2314;
}

/* --- auto: follow the OS --------------------------------------------------- */
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    color-scheme: light;
    --bg: #fcfcfd; --surface: #ffffff; --surface-2: #f5f6f8; --surface-3: #edeff2; --surface-4: #e3e6ea;
    --line: #e4e7eb; --line-2: #d3d7dd; --line-3: #b9bfc7;
    --ink: #15181d; --ink-2: #3c434d; --ink-3: #667080; --ink-4: #8d95a1;
    --accent: #1f6feb; --accent-dim: #1f6feb14; --accent-ink: #ffffff;
    --ok: #1a7f43; --ok-dim: #1a7f4314; --warn: #8f5a00; --warn-dim: #8f5a0014;
    --bad: #b62a26; --bad-dim: #b62a2614;
    --sel: #0000000a; --code-bg: #f5f6f8; --overlay: #1a1d2380;
    --shadow: 0 16px 48px #1a1d231f, 0 2px 10px #1a1d2314;
  }
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    color-scheme: dark;
    --bg: #0a0b0d; --surface: #0f1013; --surface-2: #15171b; --surface-3: #1c1f24; --surface-4: #24272e;
    --line: #202329; --line-2: #2b2f37; --line-3: #3a3f49;
    --ink: #e9ebef; --ink-2: #b3b9c2; --ink-3: #828a95; --ink-4: #5a616b;
    --accent: #8ab4f8; --accent-dim: #8ab4f826; --accent-ink: #0a0b0d;
    --ok: #6ecf83; --ok-dim: #6ecf831c; --warn: #e5b567; --warn-dim: #e5b5671c;
    --bad: #e8756b; --bad-dim: #e8756b1c;
    --sel: #ffffff0d; --code-bg: #121418; --overlay: #06070a99;
    --shadow: 0 16px 48px #00000066, 0 2px 10px #0000004d;
  }
}

/* ===========================================================================
   base
   =========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--t-base);
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-1); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: fixed; left: var(--s-2); top: -60px; z-index: 200;
  background: var(--accent); color: var(--accent-ink);
  padding: var(--s-2) var(--s-3); border-radius: var(--r-2);
  font-size: var(--t-sm); text-decoration: none; transition: top var(--dur-2) var(--ease);
}
.skip:focus { top: var(--s-2); }

/* mono is a semantic, not a decoration: it marks machine-generated facts */
.mono { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: -.1px; }

/* ===========================================================================
   shell
   =========================================================================== */
#app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  height: 100dvh;
  overflow: hidden;
}
#app[data-sidebar="collapsed"] { grid-template-columns: 0 minmax(0, 1fr); }
#app[data-sidebar="collapsed"] #sidebar { visibility: hidden; }

/* --- sidebar --------------------------------------------------------------- */
#sidebar {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--surface);
  border-right: 1px solid var(--line);
  overflow: hidden;
}
.side-head {
  display: flex; align-items: center; gap: var(--s-2);
  height: var(--head-h); padding: 0 var(--s-3) 0 var(--s-4);
  flex-shrink: 0;
}
.brand {
  display: flex; align-items: baseline; gap: var(--s-2);
  font-size: var(--t-md); font-weight: 600; letter-spacing: -.2px;
}
.brand .ver { font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4); font-weight: 400; }
.side-head .spacer { flex: 1; }

.icon-btn {
  display: inline-grid; place-items: center;
  width: 28px; height: 28px; border-radius: var(--r-1);
  color: var(--ink-3);
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 15px; height: 15px; }

.side-body { padding: 0 var(--s-3); }

.new-btn {
  display: flex; align-items: center; justify-content: center; gap: var(--s-2);
  width: 100%; height: 36px; margin-bottom: var(--s-3);
  border: 1px solid var(--line-2); border-radius: var(--r-2);
  background: var(--surface-2); color: var(--ink);
  font-size: var(--t-base); font-weight: 500;
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease);
}
.new-btn:hover { background: var(--surface-3); border-color: var(--line-3); }
.new-btn svg { width: 14px; height: 14px; color: var(--ink-3); }
.new-btn:disabled { opacity: .5; cursor: not-allowed; }

.filter-btn {
  display: flex; align-items: center; gap: var(--s-2);
  width: 100%; height: 30px; padding: 0 var(--s-2);
  border-radius: var(--r-1); color: var(--ink-3);
  font-size: var(--t-sm);
}
.filter-btn:hover { background: var(--surface-2); color: var(--ink-2); }
.filter-btn svg { width: 13px; height: 13px; }
.filter-btn .val { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.side-search { padding: 0 var(--s-3) var(--s-2); }
.field {
  width: 100%; height: 30px; padding: 0 var(--s-2);
  background: var(--surface-2); color: var(--ink);
  border: 1px solid transparent; border-radius: var(--r-1);
  font-size: var(--t-sm);
  transition: border-color var(--dur-1) var(--ease), background var(--dur-1) var(--ease);
}
.field::placeholder { color: var(--ink-4); }
.field:focus { background: var(--surface); border-color: var(--line-3); outline: none; }

#sessionList {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: var(--s-1) var(--s-2) var(--s-4);
  scrollbar-width: thin; scrollbar-color: var(--line-3) transparent;
}
#sessionList::-webkit-scrollbar { width: 8px; }
#sessionList::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: var(--r-full); border: 2px solid var(--surface); }

.group-label {
  display: flex; align-items: center; gap: var(--s-2);
  padding: var(--s-3) var(--s-2) var(--s-1);
  font-size: var(--t-2xs); font-weight: 600;
  letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-4);
}
.group-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.session {
  display: block; width: 100%; text-align: left;
  padding: var(--s-2) var(--s-2) var(--s-2) var(--s-3);
  border-radius: var(--r-1); border-left: 2px solid transparent;
  color: var(--ink-2); transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.session:hover { background: var(--surface-2); color: var(--ink); }
.session[aria-current="true"] {
  background: var(--surface-3); border-left-color: var(--accent); color: var(--ink);
}
.session .row1 { display: flex; align-items: center; gap: var(--s-2); }
.session .label {
  flex: 1; min-width: 0; font-size: var(--t-base);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session .at { font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4); flex-shrink: 0; }
.session .row2 {
  font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  margin-top: 1px; padding-left: 0;
}
.session[aria-current="true"] .row2 { color: var(--ink-3); }

/* a live turn: a dot that carries state, not an animation for its own sake */
.run-dot {
  width: 6px; height: 6px; border-radius: var(--r-full);
  background: var(--warn); flex-shrink: 0;
  box-shadow: 0 0 0 3px var(--warn-dim);
}
@media (prefers-reduced-motion: no-preference) {
  .run-dot { animation: breathe 1.6s var(--ease) infinite; }
}
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

.side-foot {
  display: flex; align-items: center; gap: var(--s-1);
  padding: var(--s-2) var(--s-3); border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.conn { display: flex; align-items: center; gap: var(--s-2); font-size: var(--t-xs); color: var(--ink-4); min-width: 0; }
.conn .dot { width: 6px; height: 6px; border-radius: var(--r-full); background: var(--ok); flex-shrink: 0; }
.conn .dot[data-state="connecting"] { background: var(--warn); }
.conn .dot[data-state="down"] { background: var(--bad); }
.conn .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot .spacer { flex: 1; }

.link-btn {
  padding: var(--s-1) var(--s-2); border-radius: var(--r-1);
  font-size: var(--t-xs); color: var(--ink-3);
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
  white-space: nowrap;
}
.link-btn:hover { background: var(--surface-3); color: var(--ink); }

/* --- main ------------------------------------------------------------------ */
#main { display: flex; flex-direction: column; min-width: 0; position: relative; overflow: hidden; }

#header {
  display: flex; align-items: center; gap: var(--s-3);
  height: var(--head-h); padding: 0 var(--s-5); flex-shrink: 0;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}
#header .head-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
#title {
  margin: 0; font-size: var(--t-lg); font-weight: 600; letter-spacing: -.35px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25;
}
#title[data-empty="true"] { color: var(--ink-3); font-weight: 500; }
.meta { display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
.meta-chip {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-3);
  max-width: 26rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.meta-chip svg { width: 11px; height: 11px; flex-shrink: 0; color: var(--ink-4); }
button.meta-chip:hover { color: var(--ink); }
.meta .sep { color: var(--ink-4); font-size: var(--t-2xs); }
#header .tools { display: flex; align-items: center; gap: var(--s-2); flex-shrink: 0; }

.ghost-btn {
  display: inline-flex; align-items: center; gap: var(--s-2);
  height: 30px; padding: 0 var(--s-3);
  border: 1px solid var(--line-2); border-radius: var(--r-2);
  color: var(--ink-2); font-size: var(--t-sm);
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.ghost-btn:hover { background: var(--surface-2); border-color: var(--line-3); color: var(--ink); }
.ghost-btn svg { width: 13px; height: 13px; color: var(--ink-3); }
.ghost-btn[data-variant="danger"] { border-color: var(--bad); color: var(--bad); }
.ghost-btn[data-variant="danger"]:hover { background: var(--bad-dim); }
.ghost-btn:disabled { opacity: .5; cursor: not-allowed; }

#statusBar {
  display: none; align-items: center; gap: var(--s-3);
  padding: var(--s-2) var(--s-5);
  font-size: var(--t-sm);
  background: var(--warn-dim); color: var(--warn);
  border-bottom: 1px solid var(--line);
}
#statusBar.on { display: flex; }
#statusBar[data-kind="down"] { background: var(--bad-dim); color: var(--bad); }
#statusBar .spacer { flex: 1; }
#statusBar button {
  border: 1px solid currentColor; border-radius: var(--r-1);
  padding: 2px var(--s-2); font-size: var(--t-xs); color: inherit;
  background: transparent;
}
#statusBar button:hover { background: #ffffff14; }

/* --- transcript ------------------------------------------------------------ */
#transcriptWrap { flex: 1; position: relative; min-height: 0; }
#transcript {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  padding: var(--s-6) var(--s-5) var(--s-8);
  overscroll-behavior: contain;
  scrollbar-width: thin; scrollbar-color: var(--line-3) transparent;
}
#transcript::-webkit-scrollbar { width: 10px; }
#transcript::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: var(--r-full); border: 3px solid var(--bg); }
#transcript::-webkit-scrollbar-thumb:hover { background: var(--line-3); }
#scroll { max-width: var(--measure); margin: 0 auto; }

/* A message is a ledger entry: [seq] in the gutter, content in the body.
   The gutter is what makes a long session scannable - and seq is the address
   the TUI shows too, so the same numbers work in both front ends. */
.entry { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr); gap: 0; }
.entry + .entry { margin-top: var(--s-5); }
.gutter {
  display: flex; justify-content: flex-end; padding-right: var(--s-3);
  padding-top: 1px;
}
.gutter .seq {
  font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4);
  user-select: none; line-height: 1.9;
}
.entry.user .gutter .seq { color: var(--ink-4); }

.entry .body { min-width: 0; }
.entry .role {
  display: flex; align-items: center; gap: var(--s-2);
  font-size: var(--t-2xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: var(--s-2);
}
.entry.assistant .role { color: var(--ink-3); }

/* prose */
.prose { font-size: var(--t-md); line-height: 1.68; color: var(--ink); overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 .85em; }
.prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
  margin: 1.4em 0 .5em; font-weight: 620; line-height: 1.3; letter-spacing: -.2px;
}
.prose h1 { font-size: 1.34em; } .prose h2 { font-size: 1.2em; } .prose h3 { font-size: 1.06em; }
.prose h4, .prose h5, .prose h6 { font-size: 1em; color: var(--ink-2); }
.prose ul, .prose ol { margin: .6em 0 .9em; padding-left: 1.4em; }
.prose li { margin: .28em 0; }
.prose li::marker { color: var(--ink-4); }
.prose li.task { list-style: none; margin-left: -1.25em; }
.prose li.task input { margin-right: .55em; accent-color: var(--accent); }
.prose a { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-dim); text-underline-offset: 2px; }
.prose a:hover { text-decoration-color: currentColor; }
.prose strong { font-weight: 620; }
.prose blockquote {
  margin: .9em 0; padding: 0 0 0 var(--s-3);
  border-left: 2px solid var(--line-3); color: var(--ink-2);
}
.prose hr { border: 0; border-top: 1px solid var(--line-2); margin: 1.4em 0; }
.prose code {
  font-family: var(--font-mono); font-size: .87em;
  background: var(--code-bg); border: 1px solid var(--line);
  padding: .08em .34em; border-radius: var(--r-1); color: var(--ink);
}
.prose pre {
  margin: .9em 0; padding: var(--s-3) var(--s-4);
  background: var(--code-bg); border: 1px solid var(--line);
  border-radius: var(--r-2); overflow: auto; max-height: 30rem;
}
.prose pre code { background: none; border: 0; padding: 0; font-size: var(--t-sm); line-height: 1.6; }
.prose table {
  border-collapse: collapse; margin: .9em 0; font-size: var(--t-sm);
  display: block; overflow-x: auto; max-width: 100%;
}
.prose th, .prose td { border: 1px solid var(--line-2); padding: var(--s-1) var(--s-2); text-align: left; }
.prose th { background: var(--surface-2); font-weight: 600; }
.prose del { color: var(--ink-3); }

/* user turn: a quiet panel, not a bubble */
.entry.user .prose {
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-2); padding: var(--s-3) var(--s-4);
  white-space: pre-wrap; color: var(--ink);
}

.caret {
  display: inline-block; width: 2px; height: 1.05em; vertical-align: -.16em;
  background: var(--accent); margin-left: 2px;
}
@media (prefers-reduced-motion: no-preference) {
  .caret { animation: blink 1.1s steps(1) infinite; }
}
@keyframes blink { 50% { opacity: 0; } }

/* thinking: collapsed, one line, no chrome noise */
.think { border-top: 1px solid var(--line); }
.think summary {
  display: flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) 0; cursor: pointer; list-style: none;
  font-size: var(--t-sm); color: var(--ink-4);
  transition: color var(--dur-1) var(--ease);
}
.think summary:hover { color: var(--ink-2); }
.think summary::-webkit-details-marker { display: none; }
.chev { width: 9px; height: 9px; flex-shrink: 0; transition: transform var(--dur-2) var(--ease); color: var(--ink-4); }
details[open] > summary .chev { transform: rotate(90deg); }
.think .content {
  padding: 0 0 var(--s-3) var(--s-4);
  border-left: 2px solid var(--line);
  margin-left: 4px;
  font-size: var(--t-sm); line-height: 1.65; color: var(--ink-3);
  white-space: pre-wrap; max-height: 24rem; overflow-y: auto;
}

/* tool call: a compact card that states name, args and outcome in one line */
.tool {
  border: 1px solid var(--line); border-radius: var(--r-2);
  background: var(--surface);
  overflow: hidden;
  transition: border-color var(--dur-1) var(--ease);
}
.tool + .tool { margin-top: var(--s-2); }
.tool:hover { border-color: var(--line-2); }
.tool[open] { border-color: var(--line-2); }
.tool > summary {
  display: flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-3); cursor: pointer; list-style: none;
}
.tool > summary::-webkit-details-marker { display: none; }
.tool .nm {
  font-family: var(--font-mono); font-size: var(--t-sm); font-weight: 600;
  color: var(--ink); flex-shrink: 0;
}
.tool .arg {
  flex: 1; min-width: 0;
  font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tool[open] .arg { visibility: hidden; }
.tool .tool-state {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-mono); font-size: var(--t-2xs);
  padding: 1px var(--s-2); border-radius: var(--r-full); flex-shrink: 0;
}
.tool .tool-state::before { content: ""; width: 5px; height: 5px; border-radius: var(--r-full); background: currentColor; }
.tool .tool-state[data-s="running"] { color: var(--warn); background: var(--warn-dim); }
.tool .tool-state[data-s="ok"] { color: var(--ok); background: var(--ok-dim); }
.tool .tool-state[data-s="fail"] { color: var(--bad); background: var(--bad-dim); }

.tool .pane { border-top: 1px solid var(--line); background: var(--bg); }
.tool .pane .lbl {
  font-size: var(--t-2xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-4); padding: var(--s-2) var(--s-3) var(--s-1);
}
.tool .pane pre {
  margin: 0; padding: 0 var(--s-3) var(--s-3);
  font-family: var(--font-mono); font-size: var(--t-xs); line-height: 1.6;
  color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 24rem; overflow: auto;
}
.tool .pane pre.muted { color: var(--ink-4); font-style: italic; }

/* inline notice: command output, errors */
.notice {
  border: 1px solid var(--line); border-radius: var(--r-2);
  background: var(--surface); padding: var(--s-3) var(--s-4);
}
.notice[data-kind="error"] { border-color: var(--bad); background: var(--bad-dim); }
.notice[data-kind="warn"] { border-color: var(--warn); background: var(--warn-dim); }
.notice .nhead {
  display: flex; align-items: center; gap: var(--s-2);
  font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-3);
  margin-bottom: var(--s-2);
}
.notice[data-kind="error"] .nhead { color: var(--bad); }
.notice .nbody { font-size: var(--t-sm); line-height: 1.6; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.notice .nbody p { margin: .3em 0; }
.notice .nactions { display: flex; gap: var(--s-2); margin-top: var(--s-3); }
.notice .nactions button {
  border: 1px solid var(--line-3); border-radius: var(--r-1);
  padding: 2px var(--s-2); font-size: var(--t-xs); color: var(--ink-2);
}
.notice .nactions button:hover { background: var(--surface-3); color: var(--ink); }

/* empty / loading */
.state { max-width: 26rem; margin: 14vh auto 0; text-align: center; padding: 0 var(--s-4); }
.state .mark { font-family: var(--font-mono); font-size: var(--t-xl); color: var(--ink-4); margin-bottom: var(--s-3); letter-spacing: -.5px; }
.state h2 { margin: 0 0 var(--s-2); font-size: var(--t-md); font-weight: 600; color: var(--ink); }
.state p { margin: 0 0 var(--s-4); font-size: var(--t-base); line-height: 1.6; color: var(--ink-3); }
.state .row { display: flex; gap: var(--s-2); justify-content: center; flex-wrap: wrap; }
.kbd {
  font-family: var(--font-mono); font-size: var(--t-2xs);
  background: var(--surface-2); border: 1px solid var(--line-2); border-bottom-width: 2px;
  border-radius: 3px; padding: 0 4px; color: var(--ink-2);
}
.skeleton { max-width: var(--measure); margin: 0 auto; }
.skel {
  height: 9px; border-radius: 3px; background: var(--surface-2); margin: var(--s-3) 0;
}
@media (prefers-reduced-motion: no-preference) {
  .skel { animation: shimmer 1.5s var(--ease) infinite; }
}
@keyframes shimmer { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
.skel.w40 { width: 40%; } .skel.w70 { width: 70%; } .skel.w90 { width: 90%; }

#loadOlder {
  display: block; margin: 0 auto var(--s-6);
  border: 1px solid var(--line-2); border-radius: var(--r-full);
  padding: var(--s-1) var(--s-3); font-size: var(--t-xs); color: var(--ink-3);
  background: var(--surface);
}
#loadOlder:hover { border-color: var(--line-3); color: var(--ink); }

#jump {
  position: absolute; left: 50%; bottom: var(--s-4);
  transform: translateX(-50%) translateY(6px);
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-1) var(--s-3); border-radius: var(--r-full);
  background: var(--surface-3); border: 1px solid var(--line-3);
  color: var(--ink); font-size: var(--t-xs);
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  z-index: 5;
}
#jump.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
#jump svg { width: 11px; height: 11px; }

/* --- composer -------------------------------------------------------------- */
#composer {
  flex-shrink: 0; padding: var(--s-3) var(--s-5) var(--s-4);
  background: var(--bg); border-top: 1px solid var(--line);
}
#composer .box { max-width: var(--measure); margin: 0 auto; position: relative; }
#inputWrap {
  border: 1px solid var(--line-2); border-radius: var(--r-3);
  background: var(--surface);
  transition: border-color var(--dur-1) var(--ease), box-shadow var(--dur-1) var(--ease);
}
#inputWrap:focus-within { border-color: var(--line-3); box-shadow: 0 0 0 3px var(--accent-dim); }
#inputWrap[data-muted="true"] { opacity: .6; }
#prompt {
  display: block; width: 100%; min-height: 44px; max-height: 40vh;
  padding: var(--s-3) var(--s-3) var(--s-1);
  background: transparent; border: 0; resize: none;
  font-family: inherit; font-size: var(--t-md); line-height: 1.55; color: var(--ink);
  overflow-y: auto;
}
#prompt:focus { outline: none; }
#prompt::placeholder { color: var(--ink-4); }
#prompt:disabled { cursor: not-allowed; }

.composer-row {
  display: flex; align-items: center; gap: var(--s-2);
  padding: var(--s-1) var(--s-2) var(--s-2) var(--s-3);
}
.composer-row .spacer { flex: 1; }
.send-btn {
  display: inline-grid; place-items: center;
  width: 30px; height: 30px; border-radius: var(--r-2);
  background: var(--accent); color: var(--accent-ink);
  transition: opacity var(--dur-1) var(--ease), transform var(--dur-1) var(--ease);
}
.send-btn:hover:not(:disabled) { opacity: .88; }
.send-btn:active:not(:disabled) { transform: scale(.96); }
.send-btn:disabled { background: var(--surface-4); color: var(--ink-4); cursor: not-allowed; }
.send-btn svg { width: 15px; height: 15px; }

.footRow {
  display: flex; align-items: center; gap: var(--s-3);
  margin-top: var(--s-2); min-height: 16px;
  font-size: var(--t-2xs); color: var(--ink-4);
}
.footRow .spacer { flex: 1; }
.footRow .hints { display: flex; align-items: center; gap: var(--s-2); overflow: hidden; white-space: nowrap; }
/* the stat strip: real numbers from the session, in mono */
.stats { display: flex; align-items: center; gap: var(--s-3); font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4); }
.stats .stat { display: inline-flex; align-items: center; gap: var(--s-1); white-space: nowrap; }
.stats .stat b { font-weight: 400; color: var(--ink-3); }
.stats .sep { color: var(--line-3); }
.stats .bar { width: 34px; height: 3px; border-radius: var(--r-full); background: var(--surface-4); overflow: hidden; }
.stats .bar i { display: block; height: 100%; background: var(--ink-4); border-radius: var(--r-full); transition: width var(--dur-2) var(--ease), background var(--dur-2) var(--ease); }
.stats .bar[data-hot="true"] i { background: var(--warn); }

/* command palette */
#palette {
  position: absolute; bottom: calc(100% - 4px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r-3); box-shadow: var(--shadow);
  display: none; flex-direction: column; overflow: hidden; z-index: 20;
  max-height: 44vh;
}
#palette.on { display: flex; }
#palette .phead {
  padding: var(--s-2) var(--s-3); border-bottom: 1px solid var(--line);
  font-size: var(--t-2xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-4);
}
#paletteList { overflow-y: auto; padding: var(--s-1); }
.pal-item {
  display: flex; align-items: baseline; gap: var(--s-2); width: 100%;
  padding: var(--s-2) var(--s-2); border-radius: var(--r-1); text-align: left;
}
.pal-item .n { font-family: var(--font-mono); font-size: var(--t-sm); font-weight: 600; color: var(--ink); flex-shrink: 0; }
.pal-item .u { font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4); flex-shrink: 0; }
.pal-item .d { flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-item .lock { font-size: var(--t-2xs); color: var(--ink-4); flex-shrink: 0; font-family: var(--font-mono); }
.pal-item[aria-selected="true"] { background: var(--surface-3); }
.pal-item[aria-selected="true"] .d { color: var(--ink-2); }
.pal-item:hover { background: var(--surface-2); }
#palette .pfoot {
  display: flex; gap: var(--s-3); padding: var(--s-2) var(--s-3);
  border-top: 1px solid var(--line); font-size: var(--t-2xs); color: var(--ink-4);
}

/* --- overlays -------------------------------------------------------------- */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: var(--overlay);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease);
}
.scrim.on { opacity: 1; pointer-events: auto; }

.modal {
  position: fixed; z-index: 41; left: 50%; top: 12vh;
  transform: translateX(-50%) translateY(-4px);
  width: min(38rem, calc(100vw - 24px)); max-height: 72dvh;
  display: none; flex-direction: column; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: var(--r-3); box-shadow: var(--shadow);
  opacity: 0; transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
}
.modal.on { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
.modal .mhead {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-4); border-bottom: 1px solid var(--line);
}
.modal .mhead h2 { margin: 0; flex: 1; font-size: var(--t-base); font-weight: 600; }
.modal .mbody { padding: var(--s-3) var(--s-4) var(--s-2); }
.modal .mfoot {
  display: flex; gap: var(--s-3); padding: var(--s-2) var(--s-4);
  border-top: 1px solid var(--line); font-size: var(--t-2xs); color: var(--ink-4);
}
.pick-list { overflow-y: auto; max-height: 44dvh; margin: var(--s-2) calc(var(--s-4) * -1) 0; }
.pick {
  display: flex; align-items: center; gap: var(--s-3); width: 100%;
  padding: var(--s-2) var(--s-4); text-align: left;
  border-left: 2px solid transparent;
}
.pick:hover { background: var(--surface-2); }
.pick[aria-selected="true"] { background: var(--surface-3); border-left-color: var(--accent); }
.pick .pti { flex: 1; min-width: 0; }
.pick .pt { font-size: var(--t-base); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .pm { font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.pick .here { font-size: var(--t-2xs); color: var(--ink-4); font-family: var(--font-mono); flex-shrink: 0; }
.empty-row { padding: var(--s-5); text-align: center; font-size: var(--t-sm); color: var(--ink-3); }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 42;
  width: min(46rem, 96vw); display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--line-2);
  box-shadow: var(--shadow);
  transform: translateX(101%);
  transition: transform var(--dur-2) var(--ease);
}
.panel.on { transform: translateX(0); }
.panel .phead {
  display: flex; align-items: center; gap: var(--s-2);
  height: var(--head-h); padding: 0 var(--s-4); flex-shrink: 0;
  border-bottom: 1px solid var(--line);
}
.panel .phead h2 { margin: 0; flex: 1; font-size: var(--t-base); font-weight: 600; }
.panel .pmeta {
  padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: var(--t-2xs); color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 0;
}
.panel .pbody { flex: 1; overflow: auto; min-height: 0; }
.panel pre.log {
  margin: 0; padding: var(--s-3) var(--s-4);
  font-family: var(--font-mono); font-size: var(--t-xs); line-height: 1.65;
  color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere;
}
.panel iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
.panel .ptabs {
  display: flex; gap: var(--s-1); padding: var(--s-2) var(--s-3); flex-shrink: 0;
  border-bottom: 1px solid var(--line); overflow-x: auto;
}
.ptab {
  padding: var(--s-1) var(--s-3); border-radius: var(--r-full);
  font-size: var(--t-sm); color: var(--ink-3); white-space: nowrap;
  transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
}
.ptab:hover { background: var(--surface-2); color: var(--ink-2); }
.ptab[aria-selected="true"] { background: var(--surface-3); color: var(--ink); }

#toast {
  position: fixed; left: 50%; bottom: var(--s-5); z-index: 60;
  transform: translateX(-50%) translateY(8px);
  padding: var(--s-2) var(--s-4); border-radius: var(--r-2);
  background: var(--surface-4); border: 1px solid var(--line-3);
  color: var(--ink); font-size: var(--t-sm);
  box-shadow: var(--shadow);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  max-width: min(30rem, 92vw);
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast[data-kind="error"] { border-color: var(--bad); color: var(--bad); }

/* ===========================================================================
   narrow: the sidebar becomes a drawer
   =========================================================================== */
#drawerToggle { display: none; }
@media (max-width: 860px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #drawerToggle { display: inline-grid; }
  #sidebar {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 41;
    width: min(84vw, 300px);
    transform: translateX(-101%);
    transition: transform var(--dur-2) var(--ease);
    border-right: 1px solid var(--line-2);
    box-shadow: var(--shadow);
  }
  #app[data-drawer="open"] #sidebar { transform: translateX(0); }
  #app[data-sidebar="collapsed"] #sidebar { visibility: visible; }
  #header { padding: 0 var(--s-3); gap: var(--s-2); }
  #transcript { padding: var(--s-4) var(--s-3) var(--s-6); }
  #composer { padding: var(--s-2) var(--s-3) var(--s-3); }
  .prose { font-size: var(--t-base); }
  .footRow .hints { display: none; }
  .stats { gap: var(--s-2); }
}
@media (max-width: 560px) {
  :root { --gutter: 34px; }
  #title { font-size: var(--t-md); }
  .meta-chip { max-width: 10rem; }
  #header .tools .txt { display: none; }
  .ghost-btn { padding: 0 var(--s-2); }
  .stats .stat.opt { display: none; }
  .prose pre { max-height: 20rem; }
}

/* ===========================================================================
   motion + print
   =========================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}
@media print {
  #sidebar, #composer, #header .tools, #statusBar, #jump { display: none !important; }
  #app { display: block; }
  body { overflow: visible; }
  #transcript { overflow: visible; height: auto; padding: 0; }
  .entry { break-inside: avoid; }
}
</style>
</head>
<body>
<a class="skip" href="#prompt">Skip to composer</a>

<div id="app" data-sidebar="open" data-drawer="closed">

  <!-- ---------------------------------------------------------------- rail -->
  <aside id="sidebar" aria-label="Sessions">
    <div class="side-head">
      <span class="brand">fox-agent <span class="ver">%VERSION%</span></span>
      <span class="spacer"></span>
      <button class="icon-btn" id="collapseBtn" title="Hide sidebar (Ctrl+B)" aria-label="Hide sidebar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9.5 4.5 6 8l3.5 3.5"/><path d="M3 2.5v11"/></svg>
      </button>
    </div>

    <div class="side-body">
      <button class="new-btn" id="newBtn" title="New session (Alt+N)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3.5v9M3.5 8h9"/></svg>
        New session
      </button>
    </div>

    <div class="side-search">
      <label class="sr-only" for="sessionFilter">Filter sessions</label>
      <input class="field" id="sessionFilter" type="search" placeholder="Filter sessions" autocomplete="off" spellcheck="false">
    </div>

    <nav id="sessionList" role="listbox" aria-label="Session list"></nav>

    <div class="side-foot">
      <span class="conn">
        <span class="dot" id="connDot" data-state="connecting"></span>
        <span class="txt" id="connText">Connecting</span>
      </span>
      <span class="spacer"></span>
      <button class="link-btn" id="logBtn" title="Debug log (Ctrl+Shift+L)">Log</button>
      <button class="link-btn" id="themeBtn" title="Theme: auto, light or dark">Auto</button>
    </div>
  </aside>

  <!-- ---------------------------------------------------------------- main -->
  <main id="main">
    <header id="header">
      <button class="icon-btn" id="drawerToggle" aria-label="Open sessions" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
      </button>

      <div class="head-main">
        <h1 id="title" data-empty="true">No session</h1>
        <div class="meta">
          <button class="meta-chip" id="cwdChip" hidden title="working directory — click to copy">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 4.5h4l1.4 1.6h7.6v7.4a1 1 0 0 1-1 1H2.5a1 1 0 0 1-1-1z"/></svg>
            <span></span>
          </button>
          <span class="sep" id="metaSep" hidden>·</span>
          <span class="meta-chip" id="modelChip" title="model">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 6.5h5M5.5 9.5h3"/></svg>
            <span>%MODEL%</span>
          </span>
        </div>
      </div>

      <div class="tools">
        <button class="ghost-btn" id="switchBtn" title="Switch session (Ctrl+K)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 5.5h8.5L9 3M13 10.5H4.5L7 13"/></svg>
          <span class="txt">Sessions</span>
        </button>
        <button class="ghost-btn" id="stopBtn" data-variant="danger" hidden title="Stop the running turn (Esc)">
          <svg viewBox="0 0 16 16" fill="currentColor"><rect x="5" y="5" width="6" height="6" rx="1"/></svg>
          <span class="txt">Stop</span>
        </button>
      </div>
    </header>

    <div id="statusBar" role="status" aria-live="polite">
      <span id="statusText"></span>
      <span class="spacer"></span>
      <button id="retryBtn" hidden>Retry now</button>
    </div>

    <div id="transcriptWrap">
      <div id="transcript" tabindex="0" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text">
        <div id="scroll">
          <div class="state" id="bootState">
            <div class="mark">fox</div>
            <h2>Connecting</h2>
            <p>Waiting for the gateway.</p>
            <div class="skeleton"><div class="skel w90"></div><div class="skel w70"></div><div class="skel w40"></div></div>
          </div>
        </div>
      </div>
      <button id="jump">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M4 9l4 4 4-4"/></svg>
        Latest
      </button>
    </div>

    <footer id="composer">
      <div class="box">
        <div id="palette" role="listbox" aria-label="Slash commands">
          <div class="phead" id="paletteHead">Commands</div>
          <div id="paletteList"></div>
          <div class="pfoot">
            <span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span>
            <span><span class="kbd">Tab</span> complete</span>
            <span><span class="kbd">Enter</span> run</span>
            <span><span class="kbd">Esc</span> close</span>
          </div>
        </div>

        <div id="inputWrap">
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" placeholder="Message fox-agent, or / for commands" autocomplete="off" spellcheck="false"></textarea>
          <div class="composer-row">
            <span class="spacer"></span>
            <button class="send-btn" id="sendBtn" aria-label="Send" title="Send (Enter)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4.5 7 8 3.5 11.5 7"/></svg>
            </button>
          </div>
        </div>

        <div class="footRow">
          <span class="hints" id="footHint">
            <span class="kbd">Enter</span> send
            <span class="kbd">Shift+Enter</span> newline
            <span class="kbd">/</span> commands
          </span>
          <span class="spacer"></span>
          <span class="stats" id="stats"></span>
        </div>
      </div>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<!-- session switcher -->
<div class="modal" id="switcher" role="dialog" aria-modal="true" aria-labelledby="switcherTitle">
  <div class="mhead">
    <h2 id="switcherTitle">Sessions</h2>
    <button class="link-btn" data-close>Esc</button>
  </div>
  <div class="mbody">
    <label class="sr-only" for="switchFilter">Filter sessions</label>
    <input class="field" id="switchFilter" type="search" placeholder="Filter by title, working directory or id" autocomplete="off">
    <div class="pick-list" id="switchList" role="listbox" aria-label="Sessions"></div>
  </div>
  <div class="mfoot">
    <span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span>
    <span><span class="kbd">Enter</span> open</span>
    <span><span class="kbd">Esc</span> close</span>
  </div>
</div>

<!-- side panel: debug log + plugin panels -->
<div class="panel" id="sidePanel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
  <div class="phead">
    <h2 id="panelTitle">Debug log</h2>
    <button class="ghost-btn" id="panelRefresh">Refresh</button>
    <button class="icon-btn" id="panelClose" aria-label="Close panel">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </div>
  <div class="ptabs" id="panelTabs" hidden></div>
  <div class="pmeta" id="panelMeta"></div>
  <div class="pbody" id="panelBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="ariaLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<script src="/ui.js"></script>
</body>
</html>
