<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fox-agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{--bg:#0d1117;--panel:#010409;--border:#21262d;--fg:#e6edf3;--dim:#8b949e;--accent:#1f6feb;--ok:#238636;--bad:#b02a37;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;height:100vh;display:flex;background:var(--bg);color:var(--fg);overflow:hidden}
#side{width:290px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--panel);flex-shrink:0}
#side header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
#side h1{font-size:15px;font-weight:600}
#new{background:var(--ok);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
#filter{width:100%;padding:7px 10px;background:#0d1117;border:1px solid var(--border);border-radius:6px;color:var(--fg);font-size:12px;margin:8px 10px 4px}
#filter:focus{outline:none;border-color:var(--accent)}
#sessions{flex:1;overflow-y:auto;padding:4px 8px 12px}
.sess{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent}
.sess:hover{background:#161b22}
.sess.active{background:#1f6feb22;border-left-color:var(--accent)}
.sess .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .m{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .run{color:var(--ok);font-size:10px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#head{padding:11px 18px;border-bottom:1px solid var(--border);font-size:14px;color:#c9d1d9;display:flex;align-items:center;gap:10px}
#head .model{font-size:11px;color:var(--dim);background:#161b22;padding:2px 8px;border-radius:10px}
#head .sp{flex:1}
#switcher{background:#161b22;border:1px solid var(--border);color:#c9d1d9;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
#cancel{background:var(--bad);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;display:none}
#log{flex:1;overflow-y:auto;padding:18px}
.wrap{max-width:860px;margin:0 auto}
.msg{display:flex;gap:10px;margin-bottom:14px}
.avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.msg.user .avatar{background:var(--accent)}
.msg.agent .avatar{background:var(--ok)}
.msg .body{flex:1;min-width:0}
.who{font-size:11px;color:var(--dim);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.bubble{padding:2px 0;font-size:14px;line-height:1.55;word-wrap:break-word}
.bubble pre{background:#161b22;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:8px 0}
.bubble code{font-family:var(--mono);font-size:.9em;background:#161b22;padding:1px 5px;border-radius:4px}
.bubble pre code{background:none;padding:0}
.bubble p{margin:6px 0}
.bubble table{border-collapse:collapse;margin:8px 0;font-size:13px}
.bubble th,.bubble td{border:1px solid var(--border);padding:4px 8px}
.think{max-width:860px;margin:0 auto 10px;font-size:12px;color:var(--dim);font-style:italic;border-left:2px solid var(--border);padding-left:10px;white-space:pre-wrap;max-height:140px;overflow-y:auto}
.tool{max-width:860px;margin:0 auto 8px;border:1px solid var(--border);border-radius:8px;background:#161b22;overflow:hidden}
.tool .head{padding:7px 11px;font-size:12px;font-family:var(--mono);cursor:pointer;display:flex;gap:8px;align-items:center;user-select:none}
.tool .head .chev{color:var(--dim)}
.tool .head .nm{color:#c9d1d9;font-weight:600}
.tool .head .arg{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.tool .head .ok{color:var(--ok)} .tool .head .fail{color:var(--bad)}
.tool .body{display:none;border-top:1px solid var(--border);padding:9px 11px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:340px;overflow-y:auto;color:#c9d1d9}
.tool.open .body{display:block}
#err{max-width:860px;margin:0 auto 12px;border:1px solid var(--bad);border-radius:8px;padding:10px 12px;background:#b02a3718;font-size:13px;display:none}
#err .why{color:#ff9492;white-space:pre-wrap;font-size:12px;margin:4px 0 8px}
#err button{background:var(--bad);color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;margin-right:6px}
#composer{padding:12px 18px;border-top:1px solid var(--border);position:relative}
#box{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
#in{flex:1;background:#161b22;border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--fg);font-size:14px;resize:none;font-family:inherit;line-height:1.4;max-height:160px}
#in:focus{outline:none;border-color:var(--accent)}
#send{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;cursor:pointer;flex-shrink:0}
#send:disabled{opacity:.5;cursor:default}
.caret{display:inline-block;width:8px;background:var(--accent);animation:blink 1s steps(1) infinite;height:1em;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}
#hints{position:absolute;bottom:100%;left:18px;right:18px;margin:0 auto;max-width:824px;background:#161b22;border:1px solid var(--border);border-radius:10px;overflow:hidden;display:none;z-index:5;box-shadow:0 8px 30px #0008}
#hints.on{display:block}
#hints .row{padding:6px 12px;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
#hints .row:hover,#hints .row.sel{background:#1f6feb33}
#hints .row .n{color:#c9d1d9;font-family:var(--mono);min-width:150px}
#hints .row .d{color:var(--dim);font-size:12px}
#hints .row .u{color:#6e7681;font-size:11px;font-family:var(--mono)}
#status{position:absolute;top:0;left:0;right:0;background:#9a6700;color:#fff;font-size:12px;text-align:center;padding:3px;display:none;z-index:6}
#status.on{display:block}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:9}
#modal.on{display:flex}
#logpanel{position:fixed;right:0;top:0;bottom:0;width:min(620px,92vw);background:var(--panel);border-left:1px solid var(--border);z-index:8;display:none;flex-direction:column}
#logpanel.on{display:flex}
#logpanel .lh{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#logpanel .lp{font-size:11px;color:var(--dim);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#logpanel pre{flex:1;overflow:auto;padding:12px 16px;font-family:var(--mono);font-size:11.5px;line-height:1.45;color:#c9d1d9;white-space:pre-wrap;word-break:break-word}
#modal .box2{width:min(680px,92vw);max-height:78vh;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
#modal .mh{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;display:flex;justify-content:space-between;align-items:center}
#modal .mi{padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:12px;align-items:baseline}
#modal .mi:hover{background:#161b22}
#modal .mi .t{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal .mi .m{font-size:11px;color:var(--dim);font-family:var(--mono)}
#modal .mf{padding:9px 16px;border:1px solid var(--border);border-radius:6px;background:#0d1117;color:var(--fg);margin:10px 16px;font-size:13px}
.empty{color:var(--dim);text-align:center;margin-top:18vh}
</style>
</head>
<body>
<aside id="side">
  <header><h1>fox-agent</h1><button id="new">+ New</button></header>
  <input id="filter" placeholder="filter sessions…" autocomplete="off">
  <div id="sessions"></div>
</aside>
<section id="main">
  <div id="status"></div>
  <header id="head">
    <span id="title">No session</span>
    <span class="model" id="model"></span>
    <span class="sp"></span>
    <button id="switcher">Sessions ⌃</button>
    <button id="logbtn">Log</button>
    <button id="cancel">■ Cancel</button>
  </header>
  <div id="log"><div class="wrap"><div class="empty" id="empty">Pick a session on the left, or create a new one.</div></div></div>
  <footer id="composer">
    <div id="hints"></div>
    <div id="box">
      <textarea id="in" rows="1" placeholder="Message fox-agent…  (Enter to send · Shift+Enter newline · / for commands)"></textarea>
      <button id="send">Send</button>
    </div>
  </footer>
</section>
<div id="modal"><div class="box2">
  <div class="mh"><span>Switch session</span><span style="color:var(--dim);font-size:12px">Esc to close</span></div>
  <input class="mf" id="mfilter" placeholder="filter…" autocomplete="off">
  <div id="mlist" style="overflow-y:auto"></div>
</div></div>
<div id="logpanel">
  <div class="lh"><span>Debug log</span><span style="display:flex;gap:8px">
    <button id="logrefresh" style="background:#161b22;border:1px solid var(--border);color:#c9d1d9;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer">Refresh</button>
    <button id="logclose" style="background:#161b22;border:1px solid var(--border);color:#c9d1d9;border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer">Close</button>
  </span></div>
  <div class="lp" id="logpath"></div>
  <pre id="logtext"></pre>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md = t => window.marked ? marked.parse(t) : esc(t);
const when = ts => { const d = new Date(ts), s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const shortPath = p => { const H = ['/home/qq']; let out = p;
  for (const h of H) if (out.startsWith(h)) out = '~' + out.slice(h.length);
  return out; };

$('#model').textContent = '%MODEL%';

let ws = null, sid = null, connected = false, backoff = 500;
let sessions = [], commands = [], filter = '';
const pending = new Map(); let mid = 0;
const runs = new Map();      // sessionId -> {bubble, text, think, toolEls}
let hintIdx = 0, hintRows = [];

/* ---- connection: queue RPCs until open, reconnect with backoff, show state ---- */
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { connected = true; backoff = 500; setStatus('');
    // flush anything queued while we were down
    for (const [, q] of pending) if (q.sent === false) send(q);
    loadSessions(); };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.event) { onEvent(m); return; }
    const q = pending.get(m.id);
    if (q) { pending.delete(m.id); q.res(m.error ? { error: m.error.message } : m.result); }
  };
  ws.onclose = () => { connected = false; setStatus(`reconnecting in ${Math.round(backoff/1000)}s…`);
    setTimeout(connect, backoff); backoff = Math.min(8000, backoff * 2); };
  ws.onerror = () => {};
}
function setStatus(t) { const el = $('#status'); el.textContent = t; el.classList.toggle('on', !!t); }
function send(q) { if (!ws || ws.readyState !== 1) return false; ws.send(JSON.stringify(q.msg)); q.sent = true; return true; }
function rpc(method, params) {
  return new Promise((res, rej) => {
    const id = ++mid;
    const q = { msg: { id, method, params }, res: (r) => (r && r.error ? rej(new Error(r.error)) : res(r)), sent: false };
    pending.set(id, q);
    if (!send(q)) { /* queued: sent on open */ }
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); rej(new Error('request timed out')); } }, 30000);
  });
}

/* ---- session list ---- */
async function loadSessions() {
  try { sessions = await rpc('session.list'); } catch { sessions = []; }
  renderSessions();
}
function visibleSessions() {
  const q = filter.trim().toLowerCase();
  if (!q) return sessions;
  return sessions.filter(s => (s.title||'').toLowerCase().includes(q) || (s.cwd||'').toLowerCase().includes(q) || s.id.toLowerCase().includes(q));
}
function renderSessions() {
  const list = visibleSessions();
  $('#sessions').innerHTML = list.length ? list.map(s => `
    <div class="sess ${s.id===sid?'active':''}" data-id="${s.id}">
      <div class="t">${esc(s.title || '(untitled)')}</div>
      <div class="m">${esc(shortPath(s.cwd))} · ${when(s.updated_at)}${runs.has(s.id)?' · <span class="run">running</span>':''}</div>
    </div>`).join('') : '<div style="color:var(--dim);font-size:12px;padding:8px 10px">No sessions yet.</div>';
  document.querySelectorAll('.sess').forEach(el => el.onclick = () => openSession(el.dataset.id));
}
$('#filter').oninput = e => { filter = e.target.value; renderSessions(); };

/* ---- the session switcher (a modal over the whole session set) ---- */
function openSwitcher() {
  const list = sessions;
  const draw = () => {
    const q = $('#mfilter').value.trim().toLowerCase();
    const rows = q ? list.filter(s => (s.title||'').toLowerCase().includes(q) || (s.cwd||'').toLowerCase().includes(q) || s.id.includes(q)) : list;
    $('#mlist').innerHTML = rows.length ? rows.map(s => `
      <div class="mi" data-id="${s.id}">
        <span class="t">${esc(s.title || '(untitled)')}</span>
        <span class="m">${esc(shortPath(s.cwd))} · ${when(s.updated_at)}</span>
      </div>`).join('') : '<div style="color:var(--dim);padding:12px 16px">No sessions.</div>';
    document.querySelectorAll('#mlist .mi').forEach(el => el.onclick = () => { closeSwitcher(); openSession(el.dataset.id); });
  };
  $('#mfilter').oninput = draw;
  $('#mfilter').value = '';
  draw();
  $('#modal').classList.add('on');
  $('#mfilter').focus();
}
function closeSwitcher() { $('#modal').classList.remove('on'); }
$('#switcher').onclick = openSwitcher;
$('#modal').onclick = e => { if (e.target.id === 'modal') closeSwitcher(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('on')) closeSwitcher(); });

/* ---- open a session ---- */
async function openSession(id) {
  sid = id;
  const s = await rpc('session.get', { id });
  $('#title').textContent = s.title || s.id;
  $('#title').title = s.id + ' · ' + s.cwd;
  $('#empty')?.remove();
  const log = $('#log');
  log.innerHTML = '<div class="wrap" id="transcript"></div>';
  const tr = $('#transcript');
  for (const m of s.messages) tr.appendChild(renderMsg(m.role, m.content, m.seq));
  // A turn still running in this session (started from another view): replay what
  // it has produced so far, so switching back shows the live turn, not a blank.
  const r = runs.get(id);
  if (r && r.text) {
    const b = document.createElement('div'); b.className = 'msg agent';
    b.innerHTML = '<div class="avatar">F</div><div class="body"><div class="who">fox-agent</div><div class="bubble">' + md(r.text) + '<span class="caret"></span></div></div>';
    tr.appendChild(b); r.bubble = b;
  }
  hideError();
  scroll(); renderSessions(); $('#in').focus();
}
function renderMsg(role, content, seq) {
  const d = document.createElement('div'); d.className = 'msg ' + role;
  d.innerHTML = `<div class="avatar">${role==='user'?'Q':'F'}</div><div class="body">
    <div class="who">${esc(role)}${seq!==undefined?' · ['+seq+']':''}</div><div class="bubble">${md(content||'')}</div></div>`;
  return d;
}
$('#new').onclick = async () => {
  try {
    const s = await rpc('session.new', {});
    await loadSessions();
    await openSession(s.id);
  } catch (e) { showError('could not create a session', e); }
};

/* ---- errors: inline, with retry ---- */
function showError(what, e) {
  const box = $('#err');
  box.style.display = 'block';
  box.innerHTML = `<b>${esc(what)}</b><div class="why">${esc(e && e.message ? e.message : String(e))}</div>`;
  const btn = document.createElement('button'); btn.textContent = 'Retry';
  btn.onclick = () => { hideError(); if (lastPrompt) send_(lastPrompt); };
  box.appendChild(btn);
  const close = document.createElement('button'); close.textContent = 'Dismiss';
  close.onclick = hideError;
  box.appendChild(close);
}
function hideError() { $('#err').style.display = 'none'; }

/* ---- the turn ---- */
let lastPrompt = '';
async function send_(text) {
  if (!sid) { showError('no session selected', new Error('pick or create a session first')); return; }
  hideError();
  const tr = document.getElementById('transcript') || (() => { const l = $('#log'); l.innerHTML = '<div class="wrap" id="transcript"></div>'; return $('#transcript'); })();
  tr.appendChild(renderMsg('user', text));
  const r = runs.get(sid) || {};
  r.bubble = null; r.text = ''; r.think = ''; r.tools = new Map();
  runs.set(sid, r);
  $('#cancel').style.display = 'inline-block';
  try { await rpc('turn.send', { sessionId: sid, prompt: text }); }
  catch (e) { showError('could not start the turn', e); $('#cancel').style.display = 'none'; }
}
function send() {
  const text = $('#in').value.trim();
  if (!text) return;
  $('#in').value = ''; $('#in').style.height = 'auto';
  if (text.startsWith('/')) { runCommand(text); return; }
  lastPrompt = text;
  send_(text);
}
async function runCommand(input) {
  if (!sid) return;
  try {
    const r = await rpc('command.run', { sessionId: sid, input });
    const tr = document.getElementById('transcript') || (() => { const l = $('#log'); l.innerHTML = '<div class="wrap" id="transcript"></div>'; return $('#transcript'); })();
    if (r && r.output) {
      const d = document.createElement('div'); d.className = 'msg agent';
      d.innerHTML = `<div class="avatar">/</div><div class="body"><div class="who">${esc(input)}</div><div class="bubble">${md(r.output)}</div></div>`;
      tr.appendChild(d);
    }
    if (r && r.newSessionId) await openSession(r.newSessionId);
    await loadSessions();
  } catch (e) { showError(`command ${input} failed`, e); }
}
$('#send').onclick = send;
$('#cancel').onclick = async () => {
  if (!sid) return;
  try { await rpc('turn.cancel', { sessionId: sid }); } catch (e) { showError('cancel failed', e); }
};

/* ---- slash-command hints (the TUI's own command list) ---- */
async function loadCommands() {
  try { commands = await rpc('command.list'); } catch { commands = []; }
}
function hintRows_() {
  const v = $('#in').value;
  if (!v.startsWith('/')) return [];
  const q = v.slice(1).split(/\s+/)[0].toLowerCase();
  return commands.filter(c => c.name.slice(1).toLowerCase().startsWith(q)).slice(0, 8);
}
function renderHints() {
  hintRows = hintRows_();
  const el = $('#hints');
  if (!hintRows.length) { el.classList.remove('on'); return; }
  hintIdx = Math.min(hintIdx, hintRows.length - 1);
  el.innerHTML = hintRows.map((c, i) => `<div class="row ${i===hintIdx?'sel':''}" data-i="${i}">
    <span class="n">${esc(c.name)}</span><span class="d">${esc(c.desc)}</span>${c.usage?`<span class="u">${esc(c.usage)}</span>`:''}</div>`).join('');
  el.classList.add('on');
  el.querySelectorAll('.row').forEach(r => r.onmousedown = e => { e.preventDefault(); applyHint(+r.dataset.i); });
}
function applyHint(i) {
  const c = hintRows[i]; if (!c) return;
  const inp = $('#in');
  inp.value = c.name + (c.arg ? ' ' : '');
  $('#hints').classList.remove('on');
  hintIdx = 0;
  inp.focus();
}
const input = $('#in');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  hintIdx = 0; renderHints();
});
input.addEventListener('keydown', e => {
  if ($('#hints').classList.contains('on')) {
    if (e.key === 'ArrowDown') { e.preventDefault(); hintIdx = (hintIdx + 1) % hintRows.length; renderHints(); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); hintIdx = (hintIdx - 1 + hintRows.length) % hintRows.length; renderHints(); return; }
    if (e.key === 'Tab' || (e.key === 'Enter' && hintRows.length)) { e.preventDefault(); applyHint(hintIdx); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

/* ---- the debug log panel: the web surface is also the debugging surface ---- */
async function openLog() {
  const p = $('#logpanel'); p.classList.add('on');
  $('#logtext').textContent = 'loading…';
  try {
    const r = await rpc('debug.log', { lines: 200 });
    $('#logpath').textContent = r.path;
    $('#logtext').textContent = r.lines || '(the log is empty — run fox with -d/-dd/-ddd to fill it)';
  } catch (e) { $('#logtext').textContent = 'could not read the log: ' + (e.message || e); }
}
$('#logbtn').onclick = openLog;
$('#logclose').onclick = () => $('#logpanel').classList.remove('on');
$('#logrefresh').onclick = openLog;

/* ---- streamed events ---- */
function onEvent(ev) {
  // A turn streams into ITS session, not the one on screen: keep the buffer for
  // every session so switching back shows the live turn, and render only the
  // session being viewed.
  const r = runs.get(ev.sessionId) || (runs.set(ev.sessionId, r = { bubble: null, text: '', think: '', tools: new Map() }), runs.get(ev.sessionId));
  if (ev.sessionId !== sid) { renderSessions(); return; }
  const tr = document.getElementById('transcript');
  if (!tr) return;
  if (ev.event === 'turn.status') {
    if (ev.state === 'started') { r.text = ''; r.think = ''; r.bubble = null; $('#cancel').style.display = 'inline-block'; }
    else {
      $('#cancel').style.display = 'none';
      if (ev.state === 'failed') showError('the turn failed', new Error('the provider or a tool failed — see the session log'));
      renderSessions();
    }
  } else if (ev.event === 'turn.think') {
    r.think += ev.delta;
    let th = tr.querySelector('.think.live');
    if (!th) { th = document.createElement('div'); th.className = 'think live'; th.textContent = 'thinking…'; tr.appendChild(th); scroll(); }
    th.textContent = r.think.slice(-800);
  } else if (ev.event === 'turn.delta') {
    if (r.think) { const th = tr.querySelector('.think.live'); if (th) th.classList.remove('live'); r.think = ''; }
    r.text += ev.delta;
    if (!r.bubble) { r.bubble = document.createElement('div'); r.bubble.className = 'msg agent';
      r.bubble.innerHTML = '<div class="avatar">F</div><div class="body"><div class="who">fox-agent</div><div class="bubble"></div></div>';
      tr.appendChild(r.bubble); }
    r.bubble.querySelector('.bubble').innerHTML = md(r.text) + '<span class="caret"></span>';
    scroll();
  } else if (ev.event === 'turn.tool_start') {
    if (r.think) { const th = tr.querySelector('.think.live'); if (th) th.classList.remove('live'); r.think = ''; }
    const d = document.createElement('div'); d.className = 'tool'; d.id = 't_' + ev.id;
    d.innerHTML = `<div class="head"><span class="chev">▸</span><span class="nm">${esc(ev.name)}</span><span class="arg">${esc((ev.args||'').slice(0,120))}</span><span class="st"></span></div><div class="body"></div>`;
    d.querySelector('.head').onclick = () => d.classList.toggle('open');
    tr.appendChild(d); r.tools.set(ev.id, d); scroll();
  } else if (ev.event === 'turn.tool_end') {
    const d = r.tools.get(ev.id);
    if (d) {
      d.querySelector('.st').innerHTML = ev.ok ? '<span class="ok">✓</span>' : '<span class="fail">✗</span>';
      d.querySelector('.chev').textContent = '▾'; d.classList.add('open');
      d.querySelector('.body').textContent = (ev.output || '').slice(0, 4000);
    }
  }
}
function scroll() { const l = $('#log'); l.scrollTop = l.scrollHeight; }

/* ---- boot: connect first, THEN load (the old order raced the socket) ---- */
connect();
loadCommands();
</script>
