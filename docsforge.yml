site_name: fox-agent
site_author: QQ
site_description: >-
  A light coding harness with agent-controlled context. Full machine control,
  zero permission prompts.
site_url: https://qqshi13.github.io/fox-agent/
repo_name: QQSHI13/fox-agent
repo_url: https://github.com/QQSHI13/fox-agent
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2026 QQ — Apache-2.0

# A one-keystroke route from the site to the thing the site is about.
announce:
  text: fox-agent 0.7.0 is out — install with one command.
  link: getting-started/install.md
  link_text: get it
  icon: material/rocket-launch-outline

nav:
  - title: Home
    path: index.md
  - title: Getting Started
    children:
      - title: Install
        path: getting-started/install.md
      - title: Quickstart
        path: getting-started/quickstart.md
      - title: Troubleshooting
        path: troubleshooting.md
  - title: Reference
    children:
      - title: CLI and slash commands
        path: reference/cli.md
      - title: Configuration
        path: configuration/index.md
      - title: Providers & profiles
        path: configuration/providers.md
      - title: Environment variables
        path: configuration/environment-variables.md
      - title: Tags
        path: tags.md
  - title: Tools
    children:
      - title: Overview
        path: tools/index.md
      - title: Files
        path: tools/files.md
      - title: exec & pty
        path: tools/exec-pty.md
      - title: Context editing (ctx)
        path: tools/ctx.md
      - title: Delegation (task)
        path: tools/task.md
      - title: MCP
        path: tools/mcp.md
      - title: Language servers (lsp)
        path: tools/lsp.md
      - title: fetch & repl
        path: tools/fetch-repl.md
      - title: Questions (question)
        path: tools/question.md
  - title: The TUI
    path: tui/index.md
  - title: Plugins
    path: plugins/index.md
  - title: Sessions
    path: sessions/index.md
  - title: Protocols
    children:
      - title: Overview
        path: protocols/index.md
      - title: ACP
        path: protocols/acp.md
  - title: Architecture
    children:
      - title: Layout and invariants
        path: architecture/index.md
      - title: Security model
        path: architecture/security.md

# Agent-facing docs. They ship inside the binary (docs/agent is embedded and
# materialized under $FOX_AGENT_HOME/docs) and are written for an agent to read
# with its `read` tool, not as site pages — so they are kept out of the nav, and
# out of the built site entirely: a second copy of them here would be a copy
# that drifts from the one the binary serves.
not_in_nav: |
  agent/
exclude_docs: |
  agent/

# The blog plugin is one of docsforge's always-loaded core plugins, and it
# scaffolds `docs/blog/index.md` into the source tree on every run. We have no
# blog, so declaring it here (user declarations load before the core set, and
# dedup suppresses the auto-load) is the way to stop it writing files.
plugins:
  blog:
    enabled: false
  search:
    lang: [en]
  tags:
    tags_file: tags.md
    # tag pages are generated from front matter; the listings directive is what
    # renders the index on tags.md
    listings: true
  social:
    enabled: true
    cards: true
    cards_layout_options:
      background_color: "#3f51b5"
      color: "#ffffff"

# External assets (the Google Fonts stylesheet) are fetched at build time and
# served from the site, so a reader's browser never talks to a third party.
# `docsforge build` warns and keeps going when the network is unavailable.
privacy: true

# No service worker. The default mode is `cache-first`, which precaches every
# page and serves from cache first — great for a docs site whose readers want
# offline access, wrong for anything that must never show a stale page after a
# release. `none` also removes sw.js and cache-manifest.json from the build
# entirely, and drops the template copy under assets/
offline:
  mode: none

theme:
  name: material
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  # the header logo's home link; without it the logo points at the nav root,
  # which breaks when a reader lands deep inside the site
  homepage: /
  # `Made with` in the footer. Set to false to drop the credit line.
  generator: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/QQSHI13/fox-agent
      name: fox-agent on GitHub
  # Code annotations: the JSON markers a `# (1)!` comment expands into.
  annotate:
    json: [.s2]

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
      toc_depth: 3
  - attr_list
  - md_in_html
  - tables
  - admonition
  - footnotes
  - def_list
  - abbr
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css

# Worst-case defaults: a dead link or a missing anchor should fail the PR, not
# reach the live site. `omitted_files` stays a warning because docs/agent/ is
# deliberately outside the nav.
validation:
  nav:
    omitted_files: info
    not_found: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    not_found: warn
    anchors: warn
