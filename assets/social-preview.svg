<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace,SFMono-Regular,JetBrains Mono,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191713"/>
      <stop offset="0.55" stop-color="#141310"/>
      <stop offset="1" stop-color="#100f0d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0803c"/>
      <stop offset="0.75" stop-color="#e0803c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e0803c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.16" r="0.60">
      <stop offset="0" stop-color="#e0803c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e0803c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a2620" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- title -->
  <text x="72" y="146" fill="#e6e1d8" font-size="88" font-weight="bold" letter-spacing="-4">fox-agent</text>
  <g transform="translate(596 78)">
    <rect width="104" height="36" rx="18" fill="none" stroke="#8a8578" stroke-opacity="0.5"/>
    <text x="52" y="24" text-anchor="middle" fill="#8a8578" font-size="17">v0.7.0</text>
  </g>

  <text x="74" y="206" fill="#e0803c" font-size="27" font-weight="bold" letter-spacing="-0.3">a light coding harness with agent-controlled context</text>
  <text x="74" y="248" fill="#8a8578" font-size="21">the agent edits its own context window natively — no host hacks, no permission theater</text>


  <!-- the mark: the same FOX glyphs src/tui/logo.ts paints, same amber-to-ember
       sweep. Generated from foxMarkText() so the two cannot drift. -->
