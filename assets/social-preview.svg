<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace,SFMono-Regular,JetBrains Mono,Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191713"/>
      <stop offset="0.55" stop-color="#141310"/>
      <stop offset="1" stop-color="#100f0d"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0803c"/>
      <stop offset="0.75" stop-color="#e0803c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#e0803c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.16" r="0.60">
      <stop offset="0" stop-color="#e0803c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e0803c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2a2620" stroke-width="1" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- title -->
  <text x="72" y="146" fill="#e6e1d8" font-size="88" font-weight="bold" letter-spacing="-4">fox-agent</text>
  <g transform="translate(596 78)">
    <rect width="104" height="36" rx="18" fill="none" stroke="#8a8578" stroke-opacity="0.5"/>
    <text x="52" y="24" text-anchor="middle" fill="#8a8578" font-size="17">v0.7.0</text>
  </g>

  <text x="74" y="206" fill="#e0803c" font-size="27" font-weight="bold" letter-spacing="-0.3">a light coding harness with agent-controlled context</text>
  <text x="74" y="248" fill="#8a8578" font-size="21">the agent edits its own context window natively — no host hacks, no permission theater</text>

  <rect x="72" y="288" width="1136" height="2" fill="url(#rule)"/>

  <!-- three stats -->
  <g>
    <text x="74" y="342" fill="#5f5b51" font-size="15" letter-spacing="2.6">FIRST BYTE</text>
    <text x="74" y="416" fill="#e6e1d8" font-size="70" font-weight="bold" letter-spacing="-3">21</text>
    <text x="178" y="416" fill="#8a8578" font-size="25">ms</text>
    <text x="74" y="450" fill="#e0803c" font-size="16" font-weight="bold">#2 · 22 CLIs</text>
  </g>
  <g>
    <text x="452" y="342" fill="#5f5b51" font-size="15" letter-spacing="2.6">IDLE MEMORY</text>
    <text x="452" y="416" fill="#e6e1d8" font-size="70" font-weight="bold" letter-spacing="-3">48</text>
    <text x="556" y="416" fill="#8a8578" font-size="25">MB</text>
    <text x="452" y="450" fill="#e0803c" font-size="16" font-weight="bold">#2 · 22 CLIs</text>
  </g>
  <g>
    <text x="830" y="342" fill="#5f5b51" font-size="15" letter-spacing="2.6">ONE BINARY</text>
    <text x="830" y="416" fill="#e6e1d8" font-size="70" font-weight="bold" letter-spacing="-3">no</text>
    <text x="918" y="416" fill="#8a8578" font-size="25">runtime</text>
    <text x="830" y="450" fill="#e0803c" font-size="16" font-weight="bold">no node, no python, one file</text>
  </g>

  <!-- capability row -->
  <g fill="#8a8578" font-size="18">
    <text x="74" y="524">parallel tools</text>
    <text x="252" y="524" fill="#3a362e">/</text>
    <text x="274" y="524">abort-safe</text>
    <text x="404" y="524" fill="#3a362e">/</text>
    <text x="426" y="524">SQLite sessions</text>
    <text x="604" y="524" fill="#3a362e">/</text>
    <text x="626" y="524">ACP both ways</text>
    <text x="786" y="524" fill="#3a362e">/</text>
    <text x="808" y="524">plugins</text>
  </g>

  <!-- install -->
  <rect x="72" y="558" width="880" height="46" rx="8" fill="#1b1916" stroke="#2e2b25"/>
  <text x="94" y="588" fill="#6f6a5f" font-size="17">$</text>
  <text x="113" y="588" fill="#c9c3b6" font-size="17">curl -fsSL github.com/QQSHI13/fox-agent/raw/main/install.sh | bash</text>

  <text x="1208" y="588" text-anchor="end" fill="#4a453c" font-size="15">Apache-2.0</text>

  <path d="M0 0h64M0 0v64" stroke="#e0803c" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M1280 640h-64M1280 640v-64" stroke="#e0803c" stroke-width="3" fill="none" opacity="0.5"/>
</svg>
