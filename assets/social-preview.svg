  </g>

  <rect x="72" y="288" width="1136" height="2" fill="url(#rule)"/>

  <!-- three stats -->
  <g>
    <text x="74" y="342" fill="#5f5b51" font-size="15" letter-spacing="2.6">FIRST BYTE</text>
    <text x="74" y="416" fill="#e6e1d8" font-size="70" font-weight="bold" letter-spacing="-3">21</text>
    <text x="178" y="416" fill="#8a8578" font-size="25">ms</text>
    <text x="74" y="450" fill="#e0803c" font-size="16" font-weight="bold">#2 · 22 CLIs</text>
  </g>
  <g>
    <text x="452" y="342" fill="#5f5b51" font-size="15" letter-spacing="2.6">IDLE MEMORY</text>
    <text x="452" y="416" fill="#e6e1d8" font-size="70" font-weight="bold" letter-spacing="-3">48</text>
    <text x="556" y="416" fill="#8a8578" font-size="25">MB</text>
    <text x="452" y="450" fill="#e0803c" font-size="16" font-weight="bold">#2 · 22 CLIs</text>
  </g>
  <g>
    <text x="830" y="342" fill="#5f5b51" font-size="15" letter-spacing="2.6">ONE BINARY</text>
    <text x="830" y="416" fill="#e6e1d8" font-size="70" font-weight="bold" letter-spacing="-3">no</text>
    <text x="918" y="416" fill="#8a8578" font-size="25">runtime</text>
    <text x="830" y="450" fill="#e0803c" font-size="16" font-weight="bold">no node, no python, one file</text>
  </g>

  <!-- capability row -->
  <g fill="#8a8578" font-size="18">
    <text x="74" y="524">parallel tools</text>
    <text x="252" y="524" fill="#3a362e">/</text>
