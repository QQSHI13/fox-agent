  <text x="94" y="588" fill="#6f6a5f" font-size="17">$</text>
  <text x="113" y="588" fill="#c9c3b6" font-size="17">curl -fsSL github.com/QQSHI13/fox-agent/raw/main/install.sh | bash</text>

