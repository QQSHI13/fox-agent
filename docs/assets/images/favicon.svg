<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="fox-agent">
  <!--
    Standalone tab icon: no header color behind it, so it carries its own tile.
    Drawn at 64 with 6px padding so browsers that shrink to 16px keep the ears
    apart instead of merging them into a blob.
  -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#3f51b5"/>
  <g fill="#ffffff">
    <path d="M9 12 L27 20 L20 38 Z"/>
    <path d="M37 20 L55 12 L44 38 Z"/>
    <path d="M18 24 L46 24 L32 52 Z"/>
  </g>
  <circle cx="26" cy="32" r="2.4" fill="#3f51b5"/>
  <circle cx="38" cy="32" r="2.4" fill="#3f51b5"/>
</svg>
