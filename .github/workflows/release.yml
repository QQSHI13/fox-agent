name: Release

# Manual: Actions → Release → Run workflow.
# Bumps package.json, tags v<version>, builds binaries for all supported
# targets, and publishes a GitHub Release with SHA256SUMS — the artifacts
# `fox upgrade` downloads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to release (e.g. 0.3.0 or 0.3.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "publish as a beta/prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: validate + bump version
        id: bump
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad version: $v"; exit 1; }
          if [ "${{ inputs.prerelease }}" = "false" ] && echo "$v" | grep -q -- '-'; then
            echo "version has a prerelease tag but prerelease input is false — set it"; exit 1
          fi
          jq --arg v "$v" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: commit + tag + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64, name: fox-linux-x64 }
          - { target: bun-linux-arm64, name: fox-linux-arm64 }
          - { target: bun-darwin-x64, name: fox-darwin-x64 }
          - { target: bun-darwin-arm64, name: fox-darwin-arm64 }
          - { target: bun-windows-x64, name: fox-windows-x64.exe }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: build ${{ matrix.target }}
        run: bun build --compile --bytecode --minify --target=${{ matrix.target }} ./src/cli.ts --outfile "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: out/

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: dist/*
