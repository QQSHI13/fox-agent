name: Release

# Manual: Actions → Release → Run workflow.
# Bumps package.json, tags v<version>, builds binaries for all supported
# targets, and publishes a GitHub Release with SHA256SUMS — the artifacts
# `fox upgrade` downloads.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to release (e.g. 0.3.0 or 0.3.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "publish as a beta/prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: validate + bump version
        id: bump
        run: |
          v="${{ inputs.version }}"
          v="${v#v}"
          echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "bad version: $v"; exit 1; }
          if [ "${{ inputs.prerelease }}" = "false" ] && echo "$v" | grep -q -- '-'; then
            echo "version has a prerelease tag but prerelease input is false — set it"; exit 1
          fi
          jq --arg v "$v" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: commit + tag + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

  build:
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: bun-linux-x64, name: fox-linux-x64 }
          - { target: bun-linux-arm64, name: fox-linux-arm64 }
          - { target: bun-darwin-x64, name: fox-darwin-x64 }
          - { target: bun-darwin-arm64, name: fox-darwin-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: build ${{ matrix.target }}
        run: bun build --compile --bytecode --minify --target=${{ matrix.target }} ./src/cli.ts --outfile "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: out/

  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: generate release notes
        id: notes
        run: |
          # Find previous tag (skip the one we just created)
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+' | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Collect commits
          BREAKING=""
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r line; do
            hash=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)
            
            # Skip merge commits and release commits
            if echo "$msg" | grep -qE '^Merge |^release v'; then
              continue
            fi

            # Categorize by conventional commit prefix
            if echo "$msg" | grep -qE '^[a-z]+!:'; then
              BREAKING="${BREAKING}- ${msg} (\`${hash}\`)\n"
            elif echo "$msg" | grep -qE '^feat(\(.+\))?:'; then
              FEATURES="${FEATURES}- ${msg} (\`${hash}\`)\n"
            elif echo "$msg" | grep -qE '^fix(\(.+\))?:'; then
              FIXES="${FIXES}- ${msg} (\`${hash}\`)\n"
            else
              OTHER="${OTHER}- ${msg} (\`${hash}\`)\n"
            fi
          done < <(git log --oneline "$RANGE")

          # Build release body
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$BREAKING" ]; then
              echo "### ⚠ BREAKING CHANGES"
              echo -e "$BREAKING"
            fi
            if [ -n "$FEATURES" ]; then
              echo "### ✨ Features"
              echo -e "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo -e "$FIXES"
            fi
            if [ -n "$OTHER" ]; then
              echo "### 📦 Other Changes"
              echo -e "$OTHER"
            fi
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...v${{ needs.tag.outputs.version }}"
          } > release-notes.md

          # Store body for output
          cat release-notes.md
      - name: publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          body_path: release-notes.md
          files: dist/*
