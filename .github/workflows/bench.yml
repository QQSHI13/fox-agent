name: bench

# Measures what `--version` cannot: time to first byte of an actual launch,
# idle memory, and install size — across fox-agent and every competitor CLI that
# installs cleanly. Regenerates bench/*.svg + bench/*.md and splices the
# snapshot into the top of the README, then commits the result so the graphs on
# main are never stale.
#
# Loop guard: the commit-back step pushes as github-actions[bot], and this job
# skips for that actor — so a bench commit never triggers another bench run.
#
# Weekly schedule plus every main push plus manual dispatch. Competitor
# installs are all best-effort (`|| true`): a tool that fails to install is
# recorded as n/a in the table, never estimated or invented.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Each tool is launched inside tmux so it gets a real pty, and its output
      # is read through `pipe-pane` into a FIFO — a forkless, microsecond-
      # resolution byte stream. That is what first-byte timing is built on.
      # ubuntu-latest ships tmux, but assert it so a runner image change fails
      # loudly here rather than silently reporting every timing n/a.
      - name: ensure tmux
        run: |
          command -v tmux >/dev/null || sudo apt-get install -y tmux
          tmux -V


      # Global npm installs must land in a directory that is on PATH for every
      # LATER step (each step starts a fresh shell, so plain `export PATH`
      # inside one step is lost). Pin the prefix explicitly rather than relying
      # on the runner default.
      #
      # Install scripts must be allowed explicitly: npm ≥11 blocks postinstall
      # scripts by default, and several of these CLIs fetch their native binary
      # in postinstall — without this, `opencode2` installs as a 232-byte stub
      # with no binary behind it (measured). Bare package names; keep this list
      # in sync with the install step below.
      - name: setup npm
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          # Comma-separated — a space-joined string is silently ignored as an
          # unparseable .npmrc entry (measured in CI logs), which blocks every
          # postinstall and installs binary-less stubs.
          npm config set allow-scripts "@anthropic-ai/claude-code,@openai/codex,@opencode-ai/cli,@earendil-works/pi-coding-agent,@google/gemini-cli,@github/copilot,@charmland/crush,@qwen-code/qwen-code,@kilocode/cli,codebuff,cline,@continuedev/cli,@iflow-ai/iflow-cli"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          node --version
          npm --version
          npm config get prefix
          npm config get allow-scripts

      - uses: actions/setup-python@v7
        with:
          # 3.12, not latest: aider-chat's newest compatible release and its
          # pinned dependency tree predate 3.14-era CPython (pip backtracks to
          # a 2023 aider whose C-extension pins no longer build). 3.12 has full
          # wheel coverage for everything bench installs.
          python-version: "3.12"

      # Python installs live in a venv: system pip on Ubuntu is
      # externally-managed (PEP 668), and pipx is not guaranteed present —
      # both failure modes silently produce "not installed" rows.
      - name: setup python venv
        run: |
          python3 -m venv .venv-bench
          .venv-bench/bin/pip install --upgrade pip
          echo "$PWD/.venv-bench/bin" >> "$GITHUB_PATH"
          .venv-bench/bin/pip --version

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: install competitor CLIs (best effort — failures become n/a rows)
        # Sources (verified against official docs 2026-10-08, see the research
        # notes in the bench run summary): opencode v2 = @opencode-ai/cli@beta
        # (bin opencode2); amp = ampcode.com installer (npm name moved to
        # @ampcode/cli); cursor-agent = cursor.com/install (bins cursor-agent
        # + agent); codebuff = npm `codebuff` (NOT codebuff-cli — impersonator;
        # first run downloads the real binary, keep network up); droid =
        # factory.ai installer; kimi code = code.kimi.com installer; devin =
        # cli.devin.ai installer; cline/continue/iflow = npm. Everything is
        # best-effort (`|| true`): a failed install becomes an n/a row.
        run: |
          set +e
          npm i -g @anthropic-ai/claude-code          # claude
          npm i -g @openai/codex                      # codex
          npm i -g @opencode-ai/cli@beta              # opencode v2 (bin opencode2)
          npm i -g @earendil-works/pi-coding-agent    # pi
           curl -fsSL https://pi-bolt.opensec.in/install.sh | bash  # pi-bolt
          npm i -g @google/gemini-cli                 # gemini
          npm i -g @github/copilot                    # copilot
          npm i -g @charmland/crush                   # crush
          npm i -g @qwen-code/qwen-code               # qwen
          npm i -g @kilocode/cli                      # kilo code (bins kilo + kilocode)
          npm i -g codebuff                           # codebuff (impersonator: codebuff-cli)
          npm i -g cline                              # cline
          npm i -g @continuedev/cli                   # continue (bin cn)
          npm i -g @iflow-ai/iflow-cli                # iflow
          .venv-bench/bin/pip install aider-chat      # aider, into the venv
          curl -fsSL https://jcode.sh/install | bash  # jcode (official installer per 1jehuang/jcode README)
          curl -fsSL https://ampcode.com/install.sh | bash                       # amp
          curl https://cursor.com/install -fsS | bash                            # cursor-agent (also bins `agent`)
          curl -fsSL https://app.factory.ai/cli | sh                             # droid
          # kimi code: retry the installer (a single flaky curl|bash otherwise
          # silently leaves the row MISSING), then verify the binary landed;
          # fall back to the npm package the installer itself recommends so the
          # row is measured rather than n/a.
          for attempt in 1 2 3; do
            curl -fsSL https://code.kimi.com/kimi-code/install.sh | bash && break
            echo "kimi installer attempt $attempt failed — retrying"; sleep 3
          done
          command -v kimi >/dev/null || [ -x "$HOME/.kimi-code/bin/kimi" ] || npm i -g @moonshot-ai/kimi-code
          curl -fsSL https://cli.devin.ai/install.sh | bash                      # devin
          # curl-installed CLIs land off the npm prefix; put every install dir
          # on PATH for the later steps (fresh shell per step — plain export
          # is lost). kimi-code installs to ~/.kimi-code/bin (measured: the
          # 2026-10-08 run missed it and reported the row n/a).
          for d in "$HOME/.local/bin" "$HOME/.cursor/bin" "$HOME/.kimi-code/bin" "$HOME/.factory/bin" "$HOME/bin"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          # verify against the same PATH the bench step will see: $GITHUB_PATH
          # only affects LATER steps, so this shell still cannot resolve kimi by
          # `command -v` even when the install succeeded — prepend the install
          # dirs here too, or a good install still reports MISSING.
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$HOME/.kimi-code/bin:$HOME/.factory/bin:$HOME/bin:$PATH"
          echo "--- installed versions ---"
          for b in claude codex opencode2 pi gemini copilot crush qwen aider jcode kilo kilocode amp cursor-agent agent codebuff droid kimi devin cline cn iflow; do
            command -v "$b" >/dev/null && echo "$b: $(timeout 20 "$b" --version 2>&1 | head -1)" || echo "$b: MISSING";
          done
          exit 0

      # Verify the rig BEFORE it measures. These checks cover the failure
      # modes that produced wrong published numbers: a footprint lookup
      # shared across tools, a measurement taken inside an escape sequence,
      # a probe matched only against a single chunk, a timeout ranked as a
      # measurement, and a "hermetic" run that still read the dev's config.
      - name: verify the bench rig
        run: python3 scripts/bench/bench.py --self-test

      - name: run benchmarks
        run: python3 scripts/bench/bench.py --out bench

      - name: splice snapshot into README
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          readme = Path("README.md")
          snippet = Path("bench/snippet.md").read_text()
          text = readme.read_text()
          start, end = "<!-- bench:start -->", "<!-- bench:end -->"
          assert start in text and end in text, "README bench markers missing"
          pre, rest = text.split(start, 1)
          _, post = rest.split(end, 1)
          readme.write_text(f"{pre}{start}\n{snippet}{end}{post}")
          EOF
          git diff --stat

      - name: publish table to job summary
        run: cat bench/table.md >> "$GITHUB_STEP_SUMMARY"

      - name: commit refreshed results
        # Merge, never rebase: a rebase that hits conflicts (two bench runs
        # racing on the same bench/ + README files) leaves UNMERGED files in
        # the worktree, and the retry loop then cannot even pull (measured —
        # that deadlocked a run until it gave up). `merge -X ours` auto-
        # resolves every conflicting hunk in favor of OUR fresh results, which
        # is exactly right for bench-vs-bench: both sides are "latest table",
        # and ours is the one this run measured. Unrelated changes merge
        # normally. No unmerged state can exist, so the loop cannot wedge.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench README.md
          git diff --cached --quiet && echo "no bench changes" && exit 0
          git commit -m "bench: refresh results"
          for i in 1 2 3; do
            git fetch -q origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin HEAD:main && exit 0
            fi
            git merge --no-edit -X ours origin/main
            git push origin HEAD:main && exit 0
            echo "push race lost (attempt $i) — merging origin and retrying"
            sleep 10
          done
          echo "could not push bench results after 3 attempts"
          exit 1
