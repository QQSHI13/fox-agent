name: bench

# Measures what `--version` cannot: time to first char of an actual TUI
# launch, bundle size, time to first token and memory — across fox-agent and
# every competitor CLI that installs cleanly. Regenerates bench/*.svg +
# bench/*.md and splices the snapshot into the top of the README, then commits
# the result so the graphs on main are never stale.
#
# Loop guard: the commit-back step pushes as github-actions[bot], and this job
# skips for that actor — so a bench commit never triggers another bench run.
#
# Weekly schedule plus every main push plus manual dispatch. Competitor
# installs are all best-effort (`|| true`): a tool that fails to install is
# recorded as n/a in the table, never estimated or invented.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Global npm installs must land in a directory that is on PATH for every
      # LATER step (each step starts a fresh shell, so plain `export PATH`
      # inside one step is lost). Pin the prefix explicitly rather than relying
      # on the runner default.
      #
      # Install scripts must be allowed explicitly: npm ≥11 blocks postinstall
      # scripts by default, and several of these CLIs fetch their native binary
      # in postinstall — without this, `opencode2` installs as a 232-byte stub
      # with no binary behind it (measured). Bare package names; keep this list
      # in sync with the install step below.
      - name: setup npm
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          npm config set allow-scripts "@anthropic-ai/claude-code @openai/codex opencode-ai @opencode-ai/cli @earendil-works/pi-coding-agent @google/gemini-cli @github/copilot @charmland/crush @qwen-code/qwen-code @kilocode/cli"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          node --version
          npm --version
          npm config get prefix
          npm config get allow-scripts

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Python installs live in a venv: system pip on Ubuntu is
      # externally-managed (PEP 668), and pipx is not guaranteed present —
      # both failure modes silently produce "not installed" rows.
      - name: setup python venv
        run: |
          python3 -m venv .venv-bench
          .venv-bench/bin/pip install --upgrade pip
          echo "$PWD/.venv-bench/bin" >> "$GITHUB_PATH"
          .venv-bench/bin/pip --version

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: install competitor CLIs (best effort — failures become n/a rows)
        # Sources: opencode.ai docs (v1 = `opencode` via opencode-ai, v2 = `opencode2`
        # via @opencode-ai/cli), pi.dev (npm @earendil-works/pi-coding-agent, bin `pi`),
        # DeepSeek/crush docs (npm @charmland/crush), Qwen Code docs (npm
        # @qwen-code/qwen-code), kilo.ai docs (npm @kilocode/cli), 1jehuang/jcode
        # README (install.sh), block/goose docs (download_cli.sh + CONFIGURE=false).
        # amp / cursor-agent / codebuff have no reliable one-line install and are
        # probed from PATH only — n/a when absent.
        #
        # opencode needs care: the v2 installer wipes v1's `opencode` binary, so
        # v1 is installed FIRST and copied aside under an explicit `opencode-v1`
        # name before v2 goes in. The bench script labels each by reported major.
        run: |
          set +e
          npm i -g @anthropic-ai/claude-code          # claude
          npm i -g @openai/codex                      # codex
          npm i -g opencode-ai                        # opencode v1 (bin opencode)
          mkdir -p "$HOME/.local/bin"
          # A wrapper, not a file copy: v1's launcher may resolve siblings
          # relative to its own install dir, which a copy would break — and a
          # wrapper keeps working because npm never removes the v1 package when
          # the (differently-named) v2 package goes in.
          if command -v opencode >/dev/null; then
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$(command -v opencode)" > "$HOME/.local/bin/opencode-v1"
            chmod +x "$HOME/.local/bin/opencode-v1"
          else
            echo "WARN: opencode v1 install failed — no opencode-v1"
          fi
          npm i -g @opencode-ai/cli@beta              # opencode v2 (bin opencode2; wipes v1's opencode)
          npm i -g @earendil-works/pi-coding-agent    # pi
          npm i -g @google/gemini-cli                 # gemini
          npm i -g @github/copilot                    # copilot
          npm i -g @charmland/crush                   # crush
          npm i -g @qwen-code/qwen-code               # qwen
          npm i -g @kilocode/cli                      # kilo code (bins kilo + kilocode)
          .venv-bench/bin/pip install aider-chat      # aider, into the venv
          curl -fsSL https://jcode.sh/install | bash  # jcode (official installer per 1jehuang/jcode README)
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh | CONFIGURE=false bash  # goose
          echo "--- installed versions ---"
          for b in claude codex opencode-v1 opencode opencode2 pi gemini copilot crush qwen aider jcode goose kilo kilocode; do
            command -v "$b" >/dev/null && echo "$b: $(timeout 20 "$b" --version 2>&1 | head -1)" || echo "$b: MISSING";
          done
          exit 0

      - name: run benchmarks
        run: python3 scripts/bench/bench.py --out bench

      - name: splice snapshot into README
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          readme = Path("README.md")
          snippet = Path("bench/snippet.md").read_text()
          text = readme.read_text()
          start, end = "<!-- bench:start -->", "<!-- bench:end -->"
          assert start in text and end in text, "README bench markers missing"
          pre, rest = text.split(start, 1)
          _, post = rest.split(end, 1)
          readme.write_text(f"{pre}{start}\n{snippet}{end}{post}")
          EOF
          git diff --stat

      - name: publish table to job summary
        run: cat bench/table.md >> "$GITHUB_STEP_SUMMARY"

      - name: commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench README.md
          git diff --cached --quiet && echo "no bench changes" && exit 0
          git commit -m "bench: refresh results"
          git push origin HEAD:main
