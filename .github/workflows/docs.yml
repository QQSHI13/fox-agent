name: Docs

# Builds the docs site and publishes it to GitHub Pages.
#
# The build runs here rather than on a Pages builder because the site comes
# from docsforge (a PyPI package) — there is no Jekyll/Markdown pipeline that
# can produce it. Actions installs docsforge, builds site/, and uploads that
# directory as a Pages artifact.
#
# PRs build but do not deploy, so a broken nav entry or a dead link fails the
# PR instead of the live site.
#
# No secrets required: Pages deploys with the workflow's own GITHUB_TOKEN via
# OIDC (pages: write + id-token: write below).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docsforge.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docsforge.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time, and never cancel one mid-flight: a cancelled
# publish can leave the environment serving a partial build. Unlike most
# concurrency groups this one is deliberately not per-ref — every deploy
# targets the same Pages site.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin docsforge: an unpinned `pip install` lets a docsforge release change
  # the site's output on a morning nobody touched the docs.
  #
  # 13.0.5, not 13.0.2: the top-level `announce:` key this config uses landed in
  # 13.0.4, and `docsforge check` rejects an unknown top-level key — so the older
  # pin would fail the build outright rather than silently dropping the banner.
  # The `[social]` extra is needed because `plugins.social` generates one
  # OpenGraph card per page; without pillow+cairosvg the plugin loads and does
  # nothing, and every page ships without a card.
  DOCSFORGE_VERSION: "13.0.5"
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install docsforge
        run: pip install --disable-pip-version-check "docsforge[social]==${{ env.DOCSFORGE_VERSION }}"

      - name: validate config
        # `check` is a separate gate from `build` on purpose: it validates the
        # config, the nav and every internal link/anchor, and fails on a nav
        # entry pointing at a file that no longer exists. That is exactly how
        # this workflow broke for a week — A2A was deleted in ff030e7 and
        # `protocols/a2a.md` stayed in the nav, so every run failed at build
        # time with a message about a missing page rather than a bad nav entry.
        run: docsforge check

      - name: build site
        # NOT --strict: the site legitimately carries warnings (docs/agent is
        # excluded from the site on purpose and is reported as "not in nav").
        # A warning here is not a failure; a bad nav path already fails `check`.
        run: docsforge build

      - name: verify the rendered pages are not silently broken
        # Two failure modes reach a *successful* build and are only visible in
        # the output, which is why they are asserted here rather than trusted:
        #
        # 1. A `markdown_extensions:` key in docsforge.yml REPLACES the engine's
        #    36 defaults instead of extending them (only the 3 builtins are
        #    unioned). Declaring `toc: {permalink: true}` that way unregistered
        #    pymdownx.emoji, and every `:material-*:` icon shipped as literal
        #    text. Nothing warned; the build exited 0.
        # 2. Losing permalinks the same way, which breaks deep links into the
        #    page anchors that other pages point at.
        #
        # So: assert an icon rendered as SVG, and assert headings carry their
        # anchor links. Both are cheap and both were actually broken once.
        run: |
          set -eu
          # no unrendered icon syntax anywhere in the built site
          if grep -rl ':material-\|:fontawesome-' site --include='index.html'; then
            echo "unrendered icon syntax above — pymdownx.emoji is not registered"
            exit 1
          fi
          # the landing page's cards must carry inline SVG icons
          icons=$(grep -o 'class="twemoji' site/index.html | wc -l)
          echo "inline icons on the landing page: $icons"
          test "$icons" -ge 10 || { echo "only $icons icons — pymdownx.emoji did not run"; exit 1; }
          # headings must carry permalink anchors
          links=$(grep -o 'class=headerlink' site/index.html | wc -l)
          echo "heading permalinks on the landing page: $links"
          test "$links" -ge 1 || { echo "no heading permalinks — the toc hook did not apply"; exit 1; }

      - name: verify the build is deployable
        # A silently empty or half-written site would still publish fine and
        # take the live docs down. Assert the things that must exist.
        run: |
          set -eu
          test -f site/index.html || { echo "missing site/index.html"; exit 1; }
          test -f site/404.html   || { echo "missing site/404.html"; exit 1; }
          pages=$(find site -name index.html | wc -l)
          echo "pages: $pages"
          test "$pages" -ge 20 || { echo "only $pages pages — the nav did not render"; exit 1; }
          # .nojekyll stops Pages from running the output through Jekyll, which
          # would drop files and directories whose names begin with an underscore
          # (docsforge emits site/search/ and hashed asset dirs).
          touch site/.nojekyll

      - uses: actions/configure-pages@v6
        # NOT `enablement: true`. Creating the Pages site needs admin rights
        # that the workflow's GITHUB_TOKEN does not have — that option fails
        # with "Resource not accessible by integration". The site is created
        # once, out of band (Settings -> Pages -> Source: GitHub Actions), and
        # this step only reads its config from then on.

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          # v4.0.0 began excluding dotfiles from the artifact by default, which
          # would drop the .nojekyll written a step above — and with it the
          # reason Pages stops running the output through Jekyll, whose silence
          # about underscore-prefixed dirs would take half the site down. The
          # build job's own assertion cannot catch this: the file exists on disk
          # right up until the tar step refuses to pack it, and `deploy` is
          # skipped on PR runs, so nothing fails until the live site is wrong.
          include-hidden-files: true

  deploy:
    needs: build
    # publish from main only; a PR run stops after the build job
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
